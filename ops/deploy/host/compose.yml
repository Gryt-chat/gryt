# Keep the log files from growing without end. Docker's json-file driver has no
# size limit unless the daemon sets one, and most do not.

# 20MB across two files per container, so a busy service keeps about a day and a
# quiet one months. The point is that there is a number rather than none.

# json-file rather than journald, because journald needs systemd on the host and
# Docker refuses the container without it. Gryt's own box uses an override (#198).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  # Web client, dev and local only: it will not authenticate against
  # auth.gryt.chat unless your domain is a registered redirect URI.
  client:
    build:
      context: ../..
      dockerfile: Dockerfile.client
    container_name: gryt-client
    logging: *default-logging
    profiles: ["web"]
    env_file:
      - ./.env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CLIENT_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ../..
      dockerfile: Dockerfile.server
    container_name: gryt-server
    logging: *default-logging
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Internal SFU websocket (server -> sfu container)
      SFU_WS_HOST: "ws://sfu:9092"
      DATA_DIR: /data
      # Uploads go in /data/gryt, beside the database. The image worker below
      # mounts the same volume, and the server shows its version from here.
      STORAGE_BACKEND: filesystem
      S3_BUCKET: gryt
      IMAGE_WORKER_URL: "http://image-worker:8080"
      # Required in production
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in deploy/host/.env (generate with: openssl rand -base64 48)}"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SERVER_HTTP_PORT:-5000}:5000"
    volumes:
      - ../../server/public:/app/public:ro
      - gryt-server-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      sfu:
        condition: service_healthy

  # Thumbnails, recompression and the colour behind voice tiles. It reads the job
  # queue out of the server's database, so it shares the server's volume.
  image-worker:
    image: ghcr.io/gryt-chat/image-worker:${IMAGE_WORKER_VERSION:-latest}
    container_name: gryt-image-worker
    logging: *default-logging
    environment:
      DATA_DIR: /data
      STORAGE_BACKEND: filesystem
      S3_BUCKET: gryt
    volumes:
      - gryt-server-data:/data
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

  sfu:
    build:
      context: ../..
      dockerfile: Dockerfile.sfu
    container_name: gryt-sfu
    logging: *default-logging
    env_file:
      - ./.env
    environment:
      PORT: "5005"
      # Registration, deliberately unpublished: the port above is public so clients
      # can reach it, and a published /server lets anyone use this SFU as their relay.
      SFU_CONTROL_PORT: "9092"
      STUN_SERVERS: "${STUN_SERVERS:-stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}"
      ICE_UDP_MUX_PORT: "${ICE_UDP_MUX_PORT:-3478}"
      ICE_ADVERTISE_IP: "${ICE_ADVERTISE_IP:-}"
      DISABLE_STUN: "${DISABLE_STUN:-false}"
      MAX_PEERS: "${MAX_PEERS:-}"
    ports:
      # SFU websocket (HTTP) for signaling (Cloudflare Tunnel will proxy this as HTTPS/WSS)
      - "${BIND_ADDR:-127.0.0.1}:${SFU_WS_PORT:-5005}:5005"
      # WebRTC media (UDP). One port, and it must be reachable from the public
      # internet directly — Cloudflare Tunnel does not carry it.
      - "${ICE_UDP_MUX_PORT:-3478}:${ICE_UDP_MUX_PORT:-3478}/udp"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5005/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  gryt-server-data:
