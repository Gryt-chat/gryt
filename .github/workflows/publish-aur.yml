name: Publish to the AUR

# The CachyOS Package Installer, paru and yay all browse the AUR, so this is the
# only Arch-side listing there is to keep current.

# packaging/aur/PKGBUILD is the source of truth and is copied over whatever the AUR
# holds, so a packaging change is a reviewed PR. GRYT-975 is what the reverse cost.

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v1.9.24'
        required: true
        type: string

concurrency:
  group: publish-aur
  cancel-in-progress: true

jobs:
  publish-aur:
    name: Publish to the AUR
    runs-on: ubuntu-latest

    # A `release` event does not know which dispatch produced it, so the channel
    # is read off the tag. Betas do not go in `gryt-chat-bin`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.release.tag_name, '-beta')

    # No continue-on-error: GRYT-971 is what a publisher that cannot fail costs.
    timeout-minutes: 20

    env:
      OWNER: Gryt-chat
      REPO: gryt
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      AUR_PKG: gryt-chat-bin

    steps:
      - name: Check out the AUR package
        id: checkout
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not set, skipping the AUR."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          # Pinned rather than ssh-keyscan'd: this pushes a package anyone on Arch
          # can install. SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          cat >> ~/.ssh/known_hosts <<'HOSTKEY'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          HOSTKEY

          cat >> ~/.ssh/config <<'SSHCONFIG'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          SSHCONFIG

          git clone "ssh://aur@aur.archlinux.org/${AUR_PKG}.git" aur

          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Rewrite the PKGBUILD for this release
        if: steps.checkout.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          DEB="Gryt-Chat-${VERSION}-linux-amd64.deb"

          gh release download "$TAG" \
            --repo "$OWNER/$REPO" \
            --pattern "$DEB" \
            --dir .

          SUM="$(sha256sum "$DEB" | cut -d' ' -f1)"

          # Read at the tag, so a re-run for an older release packages that
          # release's PKGBUILD. Tags cut before this file existed fall back to main.
          at() {
            gh api "repos/$OWNER/$REPO/contents/packaging/aur/PKGBUILD?ref=$1" \
              --jq '.content' 2>/dev/null | base64 -d
          }

          if at "$TAG" > pkgbuild.candidate && [[ -s pkgbuild.candidate ]]; then
            echo "Using packaging/aur/PKGBUILD from $TAG."
          elif at main > pkgbuild.candidate && [[ -s pkgbuild.candidate ]]; then
            echo "$TAG predates packaging/aur/PKGBUILD. Using main's."
          else
            echo "::error::No packaging/aur/PKGBUILD at $TAG or on main."
            exit 1
          fi

          cp pkgbuild.candidate aur/PKGBUILD

          cd aur

          # Anchored, so none of these can match the same text inside the URL
          # further down the file.
          sed -i \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${SUM}')/" \
            PKGBUILD

          echo "PKGBUILD now says:"
          grep -E '^(pkgver|pkgrel|sha256sums)=' PKGBUILD

          # A sed that matched nothing leaves the old version in place, which
          # would publish a package pointing at the wrong release.
          grep -qx "pkgver=${VERSION}" PKGBUILD
          grep -qx "sha256sums=('${SUM}')" PKGBUILD

      - name: Regenerate .SRCINFO
        if: steps.checkout.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # makepkg --printsrcinfo is the only supported way to write this file,
          # it needs Arch, and it refuses to run as root.

          # Mounted read-only and copied inside, because `chown -R build` on a
          # writable bind mount locks the runner out of the directory it commits in.
          docker run --rm -v "$PWD/aur:/pkg:ro" archlinux:base-devel bash -c '
            set -e
            useradd -m build >&2
            cp -r /pkg /tmp/pkg >&2
            chown -R build /tmp/pkg >&2
            cd /tmp/pkg
            su build -c "makepkg --printsrcinfo"
          ' > srcinfo.new

          # An empty file here would commit a .SRCINFO that tells the AUR nothing.
          [[ -s srcinfo.new ]] && grep -q '^pkgbase = ' srcinfo.new

          mv srcinfo.new aur/.SRCINFO

          echo ".SRCINFO now says:"
          grep -E '^\s+(pkgver|pkgrel|sha256sums|source)' aur/.SRCINFO || true

      - name: Push it to the AUR
        if: steps.checkout.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          cd aur

          # By name, not -A: the AUR takes these two files and nothing else.
          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "Already at ${VERSION}. Nothing to push."
            exit 0
          fi

          git config user.name "Gryt Chat"
          git config user.email "sivert@gryt.chat"

          git commit -m "Update to ${VERSION}"
          git push origin master

      # The RPC is what paru, yay and the CachyOS installer read, and it is cached
      # behind the database it reports on.

      # On the first successful publish the package page showed 1.9.24-1 at once and
      # the RPC said 1.1.24-1 for five minutes. Six 20-second attempts called it failed.
      - name: Check the AUR is serving it
        if: always() && steps.checkout.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          for attempt in $(seq 1 15); do
            LIVE="$(
              curl -sfS "https://aur.archlinux.org/rpc/v5/info?arg[]=${AUR_PKG}" \
                | python3 -c "import json,sys; r=json.load(sys.stdin).get('results',[]); print(r[0]['Version'] if r else '')" 2>/dev/null || true
            )"

            # The RPC reports pkgver-pkgrel, and pkgrel is reset to 1 above.
            if [[ "$LIVE" == "${VERSION}-1" ]]; then
              echo "${AUR_PKG} is at $LIVE. Correct."
              exit 0
            fi

            echo "Attempt $attempt: ${AUR_PKG} is \"${LIVE:-unknown}\", waiting for ${VERSION}-1."
            sleep 30
          done

          echo "::error::The AUR is serving \"${LIVE:-unknown}\" for ${AUR_PKG}, not ${VERSION}-1."
          echo "The push may still have worked and the RPC be lagging further than"
          echo "usual — the package page is the database, the RPC is a cache of it."
          echo "See https://aur.archlinux.org/packages/${AUR_PKG}"
          exit 1
