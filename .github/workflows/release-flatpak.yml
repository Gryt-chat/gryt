name: Build the Flatpak bundle

# Called by release-client.yml once the Linux build has put both .debs on the release.
# Dispatched by hand it is a dry run unless `upload` is ticked: the bundles stay artifacts.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      upload:
        required: true
        type: boolean

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build from, e.g. v1.11.42'
        required: true
        type: string
      upload:
        description: 'Attach the bundle to that release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  flatpak:
    name: Build the Flatpak bundle (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Flathub's own build image: flatpak-builder, gh, and the 25.08 runtime and SDK
    # already installed. --privileged because bwrap needs namespaces.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    strategy:
      fail-fast: false
      matrix:
        # Slim is a hard failure, same as before full existed. Full is additive,
        # so its own failure doesn't take slim down (continue-on-error below).
        variant:
          - slim
          - full

    continue-on-error: ${{ matrix.variant == 'full' }}

    env:
      OWNER: Gryt-chat
      REPO: gryt
      TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout the packaging
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packaging/flatpak
            .github/scripts

      # The -slim suffix is what tells the site which build this is; full has
      # none, the same convention the other Linux formats use.
      - name: Download the .deb from the release
        id: deb
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          if [[ "$VARIANT" == "slim" ]]; then
            DEB="Gryt-Chat-${VERSION}-linux-amd64-slim.deb"
            BUNDLE="Gryt-Chat-${VERSION}-linux-x86_64-slim.flatpak"
            APPID="chat.gryt.Gryt"
          else
            DEB="Gryt-Chat-${VERSION}-linux-amd64.deb"
            BUNDLE="Gryt-Chat-${VERSION}-linux-x86_64.flatpak"
            APPID="chat.gryt.Gryt.Full"
          fi

          mkdir -p input
          gh release download "$TAG" --repo "$OWNER/$REPO" --pattern "$DEB" --dir input --clobber

          {
            echo "version=$VERSION"
            echo "deb=input/$DEB"
            echo "bundle=$BUNDLE"
            echo "appid=$APPID"
          } >> "$GITHUB_OUTPUT"

      - name: Build the bundle
        shell: bash
        env:
          FLATPAK_SCOPE: --system
        run: |
          set -euo pipefail
          bash .github/scripts/build-flatpak.sh \
            "${{ steps.deb.outputs.deb }}" \
            "${{ steps.deb.outputs.version }}" \
            "dist/${{ steps.deb.outputs.bundle }}" \
            "${{ steps.deb.outputs.appid }}"

      # Kept a week either way, so a dry run has something to install and test.
      - name: Keep the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ steps.deb.outputs.version }}-${{ matrix.variant }}
          path: dist/${{ steps.deb.outputs.bundle }}
          retention-days: 7
          if-no-files-found: error

      - name: Attach the bundle to the release
        if: inputs.upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/${{ steps.deb.outputs.bundle }}" \
            --repo "$OWNER/$REPO" --clobber
