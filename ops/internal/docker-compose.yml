services:
  docs:
    build:
      context: ../../packages/docs
      network: host
    platform: linux/amd64
    ports:
      - "${INTERNAL_DOCS_HTTP_PORT:-9471}:3000"
    restart: unless-stopped

  site:
    build:
      context: ../../packages/site
    platform: linux/amd64
    ports:
      - "${INTERNAL_SITE_HTTP_PORT:-9472}:80"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    restart: unless-stopped

  # Component library docs (ui.gryt.chat). Built from packages/ui, which is a
  # bun workspace — the context is the workspace root because apps/docs
  # resolves @gryt/ui from source rather than from npm.
  ui:
    build:
      context: ../../packages/ui
    platform: linux/amd64
    ports:
      - "${INTERNAL_UI_HTTP_PORT:-9475}:80"
    restart: unless-stopped

  # Feature requests / user feedback (Fider)
  fider-db:
    image: postgres:17
    container_name: gryt-fider-db
    environment:
      POSTGRES_USER: "${FIDER_DB_USER:-fider}"
      POSTGRES_PASSWORD: "${FIDER_DB_PASSWORD:-changeme}"
      POSTGRES_DB: "${FIDER_DB_NAME:-fider}"
    volumes:
      - gryt-fider-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 20s
      retries: 10

  fider:
    image: getfider/fider:stable
    container_name: gryt-fider
    ports:
      - "${FIDER_HTTP_PORT:-9473}:3000"
    environment:
      # Public Host Name (must match Cloudflared hostname + scheme)
      BASE_URL: "${FIDER_BASE_URL:-https://feedback.gryt.chat}"
      # Connection string to the PostgreSQL database
      DATABASE_URL: "${FIDER_DATABASE_URL:-postgres://${FIDER_DB_USER:-fider}:${FIDER_DB_PASSWORD:-changeme}@fider-db:5432/${FIDER_DB_NAME:-fider}?sslmode=disable}"
      # Generate a secure secret, for example using https://jwtsecrets.com
      JWT_SECRET: "${FIDER_JWT_SECRET:-}"
      # From which account e-mails will be sent
      EMAIL_NOREPLY: "${FIDER_EMAIL_NOREPLY:-${GRYT_SMTP_FROM:-hello@gryt.chat}}"
      # SMTP (required)
      EMAIL_SMTP_HOST: "${FIDER_EMAIL_SMTP_HOST:-${GRYT_SMTP_HOST:-}}"
      EMAIL_SMTP_PORT: "${FIDER_EMAIL_SMTP_PORT:-${GRYT_SMTP_PORT:-587}}"
      EMAIL_SMTP_USERNAME: "${FIDER_EMAIL_SMTP_USERNAME:-${GRYT_SMTP_USER:-}}"
      EMAIL_SMTP_PASSWORD: "${FIDER_EMAIL_SMTP_PASSWORD:-${GRYT_SMTP_PASS:-}}"
      EMAIL_SMTP_ENABLE_STARTTLS: "${FIDER_EMAIL_SMTP_ENABLE_STARTTLS:-true}"
    depends_on:
      fider-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/fider", "ping"]
      interval: 2s
      timeout: 10s
      retries: 10

  # Bug reports and feedback sent from inside the apps (reports.gryt.chat).
  # Fider above is the public half people vote on; this is the one nobody else
  # reads. Pulled from GHCR rather than built here — Release Reports pushes it.
  reports:
    image: ghcr.io/gryt-chat/reports:${REPORTS_IMAGE_TAG:-latest}
    container_name: gryt-reports
    ports:
      # One port. Reports come in here and the inbox is /admin on the same
      # hostname, behind Keycloak sign-in.
      - "${INTERNAL_REPORTS_HTTP_PORT:-9476}:8080"
    environment:
      # One key per app. Without at least one the service refuses to start,
      # because what it exposes is a public POST endpoint.
      REPORTS_APP_KEYS: "${REPORTS_APP_KEYS:-}"
      REPORTS_ADMIN_TOKEN: "${REPORTS_ADMIN_TOKEN:-}"
      REPORTS_PUBLIC_URL: "${REPORTS_PUBLIC_URL:-https://reports.gryt.chat}"
      REPORTS_CORS_ORIGINS: "${REPORTS_CORS_ORIGINS:-https://app.gryt.chat,https://beta.gryt.chat}"
      REPORTS_REQUIRE_SIGNATURE: "${REPORTS_REQUIRE_SIGNATURE:-false}"
      # Behind the tunnel the socket address is the proxy, so the client
      # address has to come from cf-connecting-ip — and only when the proxy is
      # the one connecting. The ingest port is on the machine's network
      # address, so without this list anything on the LAN can claim any address
      # and skip every per-address rate limit and ban.
      REPORTS_TRUST_PROXY: "true"
      REPORTS_TRUSTED_PROXIES: "${REPORTS_TRUSTED_PROXIES:-}"
      # Triage. A URL picks the local model, a key picks the API, and naming
      # the provider wins over both. Ollama runs on another machine, so this is
      # its address on the network rather than localhost.
      REPORTS_TRIAGE_PROVIDER: "${REPORTS_TRIAGE_PROVIDER:-}"
      REPORTS_OLLAMA_URL: "${REPORTS_OLLAMA_URL:-}"
      REPORTS_OLLAMA_KEEP_ALIVE: "${REPORTS_OLLAMA_KEEP_ALIVE:-5m}"
      REPORTS_TRIAGE_TIMEOUT_MS: "${REPORTS_TRIAGE_TIMEOUT_MS:-120000}"
      # Whether the model may reason before it answers. Worth the extra seconds
      # on a model that fits on the card: it is the difference between "the app
      # crashed" and "TypeError in ChannelList".
      REPORTS_TRIAGE_THINK: "${REPORTS_TRIAGE_THINK:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      REPORTS_TRIAGE_MODEL: "${REPORTS_TRIAGE_MODEL:-}"
      REPORTS_DISCORD_WEBHOOK_URL: "${REPORTS_DISCORD_WEBHOOK_URL:-}"
      REPORTS_NOTIFY_ON: "${REPORTS_NOTIFY_ON:-triage}"
      # Signing in with a Gryt account. Who may actually read the inbox is a
      # list inside the service, not a role in the realm.
      REPORTS_OIDC_ISSUER: "${REPORTS_OIDC_ISSUER:-}"
      REPORTS_OIDC_CLIENT_ID: "${REPORTS_OIDC_CLIENT_ID:-}"
      REPORTS_OIDC_CLIENT_SECRET: "${REPORTS_OIDC_CLIENT_SECRET:-}"
      REPORTS_OIDC_REDIRECT_URI: "${REPORTS_OIDC_REDIRECT_URI:-}"
      REPORTS_BOOTSTRAP_ADMIN: "${REPORTS_BOOTSTRAP_ADMIN:-}"
      REPORTS_SESSION_SECRET: "${REPORTS_SESSION_SECRET:-}"
    volumes:
      - gryt-reports-data:/data
    restart: unless-stopped

volumes:
  gryt-fider-pg-data:
  # Every report anyone has ever sent. There are no off-box backups of this.
  gryt-reports-data:
