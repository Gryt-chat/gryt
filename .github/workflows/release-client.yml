name: Release Client

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest

      bump:
        description: "Client/product version change"
        required: true
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
          - custom

      custom_version:
        description: 'Custom stable version, if "custom" is selected. Example: 1.2.3'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  # Shared with release-server.yml on purpose. Both workflows commit to the same
  # branch, so a per-workflow group only serialised releases of the same kind and
  # let a client release and a server release race for the push.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: gryt
  DOCKER_IMAGE: ghcr.io/gryt-chat/client

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      channel: ${{ steps.channel.outputs.channel }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
      release_type: ${{ steps.release_type.outputs.release_type }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout required submodules
        shell: bash
        run: |
          set -euo pipefail

          # Clone from the URL rather than resolving the recorded gitlink. A
          # pointer at a commit that is not on the remote kills the job before
          # it reaches the code that would repair it — the same failure that
          # forced #48 to be done by hand. All four are moved to their own main
          # below, so the recorded value is discarded anyway.
          #
          # This list and the one in "Move release submodules into place"
          # have to hold the same paths. A path in the second but not the first
          # is never cloned, so the fetch there runs against a directory that is
          # not a repository and takes the job down.
          for path in packages/client packages/server packages/sfu packages/image-worker; do
            if [[ -e "$path/.git" ]]; then
              continue
            fi
            name=$(git config -f .gitmodules --get-regexp '\.path$' \
              | awk -v p="$path" '$2 == p { print $1 }' \
              | sed 's/^submodule\.//; s/\.path$//')
            url=$(git config -f .gitmodules --get "submodule.${name}.url")
            if [[ -z "$url" ]]; then
              echo "No URL in .gitmodules for $path — skipping."
              continue
            fi
            echo "Cloning $path from $url"
            rm -rf "$path"
            git clone --quiet "$url" "$path"
          done

          git submodule sync -- packages/client packages/server packages/sfu packages/image-worker

      - name: Configure client repository authentication
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_PAT:-}" ]]; then
            echo "RELEASE_PAT is required to push the client package.json version bump."
            exit 1
          fi

          git -C packages/client remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/Gryt-chat/client.git"

      - name: Verify push access before anything is published
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          MONOREPO_TOKEN: ${{ github.token }}
          MONOREPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `Release Server` died on its last push during the GitHub incident on
          # 2026-08-17 and left an image on GHCR for a version with no tag and
          # no release page. This workflow uses the same credential at the same
          # kind of step, and has more to lose: installers for three platforms
          # and a push to the Snap Store. GRYT-300.
          #
          # `ls-remote` would not have caught it. That talks to upload-pack, so
          # it only proves the credential can read, and a token that has lost
          # its write scope still answers it happily. Push is authorised
          # against git-receive-pack, so ask that service for its ref
          # advertisement instead — same request a real push starts with, and
          # it changes nothing on the remote.
          #
          # This narrows the window rather than closing it. GitHub can still
          # fall over later in the run. What it does remove is the run that was
          # never going to finish — an expired credential, or a GitHub that is
          # already unhealthy — and that run is now a no-op.
          probe() {
            local repo="$1" token="$2" code attempt

            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                -u "x-access-token:${token}" \
                "https://github.com/${repo}.git/info/refs?service=git-receive-pack" \
                || echo 000)

              case "$code" in
                200)
                  echo "  ${repo}: can push"
                  return 0
                  ;;
                401 | 403)
                  # A definite no. Retrying will not turn it into a yes.
                  echo "  ${repo}: credential is not allowed to push (HTTP ${code})" >&2
                  return 1
                  ;;
                *)
                  echo "  ${repo}: no usable answer (HTTP ${code}), attempt ${attempt}/3" >&2
                  sleep $(( attempt * 5 ))
                  ;;
              esac
            done

            echo "  ${repo}: could not confirm push access" >&2
            return 1
          }

          failed=0
          probe "Gryt-chat/client" "$RELEASE_PAT" || failed=1
          probe "$MONOREPO" "$MONOREPO_TOKEN" || failed=1

          if (( failed )); then
            echo "" >&2
            echo "Stopping before anything is published." >&2
            echo "" >&2
            echo "Check https://www.githubstatus.com first. If Git Operations are" >&2
            echo "degraded then this is not the credential, and the fix is to wait" >&2
            echo "and dispatch again. If GitHub is healthy, RELEASE_PAT has expired" >&2
            echo "or lost write access to the repo named above." >&2
            exit 1
          fi

      - name: Move release submodules into place
        shell: bash
        run: |
          set -euo pipefail

          # The client is released from its main, not from the superproject's
          # gitlink, because the gitlink only moves when update-submodules.yml
          # runs. A dispatch that never arrived, or a sweep still in flight,
          # would otherwise ship a client that disagrees with the release.
          git -C packages/client fetch origin main
          git -C packages/client checkout -B main origin/main
          echo "packages/client -> $(git -C packages/client rev-parse --short HEAD) (main)"

          # The three embedded services come from their newest release tag
          # instead. They used to come from main as well, and main is routinely
          # a commit or two past the last release, which meant the embedded
          # binaries were built from an untagged commit.
          #
          # build-embedded-server.mjs versions each artefact with `git describe`
          # when HEAD is not exactly on a tag, so those builds reported
          # "1.0.48-1-gafa06e4" rather than "1.0.49". versionCheck.ts then
          # compares that against the newest GitHub release with a parser that
          # does `(part || 0)`, and Number("48-1-gafa06e4") is NaN, which is
          # falsy, so the patch component collapsed to 0 and the whole thing
          # compared as 1.0.0. Every desktop-hosted server reported an update
          # that installing could never clear, because the next build was
          # untagged too. GRYT-306.
          #
          # Stable tags only, deliberately, on every channel. A beta client is a
          # beta of the client; embedding a prerelease of the media plane in it
          # is a separate decision, and versionCheck resolves `latest` from the
          # newest non-prerelease release, so a prerelease here would put the
          # nag straight back.
          for path in packages/server packages/sfu packages/image-worker; do
            git -C "$path" fetch origin main --tags --force

            tag=$(git -C "$path" tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
              | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' \
              | head -1)

            if [[ -z "$tag" ]]; then
              echo "::error::No stable release tag in $path. Release it before releasing the client."
              exit 1
            fi

            # Detached on purpose: this is a point in history, not a branch to
            # carry on from.
            git -C "$path" checkout --detach --quiet "$tag"
            echo "$path -> $(git -C "$path" rev-parse --short HEAD) ($tag)"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Git user
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          # The channel is picked at dispatch rather than read off the branch.
          # Deriving it from github.ref_name implied that a beta release built
          # from a beta branch, which was never true: the client submodule is
          # force-moved to client:main a few steps above, so beta and stable
          # always built identical client code. Only the labelling differed,
          # and the beta branch's stale server and SFU gitlinks made the
          # embedded binaries silently disagree with the client.
          CHANNEL="${{ github.event.inputs.channel }}"

          if [[ "$CHANNEL" != "latest" && "$CHANNEL" != "beta" ]]; then
            echo "Unsupported channel: $CHANNEL"
            exit 1
          fi

          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "Client releases run from main."
            echo "Current branch: ${{ github.ref_name }}"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL"

      - name: Validate release.json
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f release.json ]]; then
            echo "Missing release.json at repository root."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("release.json", "utf8"));

            if (data.product !== "gryt") {
              throw new Error("release.json product must be gryt");
            }

            if (!/^\d+\.\d+\.\d+$/.test(data.version)) {
              throw new Error("release.json version must be stable semver like 1.2.3");
            }

            if (data.server && !/^\d+\.\d+\.\d+$/.test(data.server)) {
              throw new Error("release.json server must be stable semver like 1.2.3");
            }
          '

      - name: Fetch release tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ steps.channel.outputs.channel }}"
          CURRENT_BASE_VERSION="$(node -p "require('./release.json').version")"
          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          bump_version() {
            local version="$1"
            local bump="$2"

            node -e '
              const current = process.argv[1];
              const bump = process.argv[2];

              const match = current.match(/^(\d+)\.(\d+)\.(\d+)$/);
              if (!match) {
                throw new Error(`Invalid version: ${current}`);
              }

              let major = Number(match[1]);
              let minor = Number(match[2]);
              let patch = Number(match[3]);

              if (bump === "major") {
                major += 1;
                minor = 0;
                patch = 0;
              } else if (bump === "minor") {
                minor += 1;
                patch = 0;
              } else if (bump === "patch") {
                patch += 1;
              } else {
                throw new Error(`Unsupported bump: ${bump}`);
              }

              console.log(`${major}.${minor}.${patch}`);
            ' "$version" "$bump"
          }

          case "$BUMP" in
            none)
              BASE_VERSION="$CURRENT_BASE_VERSION"
              ;;
            patch|minor|major)
              BASE_VERSION="$(bump_version "$CURRENT_BASE_VERSION" "$BUMP")"
              ;;
            custom)
              if [[ -z "$CUSTOM_VERSION" ]]; then
                echo "custom_version is required when bump=custom"
                exit 1
              fi

              if ! [[ "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Invalid custom version: $CUSTOM_VERSION"
                echo "Expected stable semver like 1.2.3"
                exit 1
              fi

              BASE_VERSION="$CUSTOM_VERSION"
              ;;
            *)
              echo "Unsupported bump: $BUMP"
              exit 1
              ;;
          esac

          # Refuse to publish behind what has already shipped. release.json used
          # to be per-branch: main's copy tracked stable releases while beta's
          # tracked the beta line. Moving the channel to a dispatch input merged
          # those two lines, and the first release from main computed
          # 1.3.0-beta.2 while v1.3.1-beta.1 already existed.
          #
          # Only base versions are compared, so beta.N increments within the same
          # base are still fine — it is the x.y.z going backwards that is wrong.
          HIGHEST_BASE="$(git tag --list 'v*' | sed 's/^v//; s/-.*$//' | sort -V | tail -n 1 || true)"

          if [[ -n "$HIGHEST_BASE" && "$BASE_VERSION" != "$HIGHEST_BASE" ]]; then
            OLDEST="$(printf '%s\n%s\n' "$HIGHEST_BASE" "$BASE_VERSION" | sort -V | head -n 1)"

            if [[ "$OLDEST" == "$BASE_VERSION" ]]; then
              echo "release.json is behind the tags."
              echo "  release.json base version: $BASE_VERSION"
              echo "  highest released base:     $HIGHEST_BASE"
              echo "Bump release.json to at least $HIGHEST_BASE before releasing."
              exit 1
            fi
          fi

          if [[ "$CHANNEL" == "beta" ]]; then
            LATEST_BETA_NUMBER="$(
              git tag --list "v${BASE_VERSION}-beta.*" \
                | sed -E "s/^v${BASE_VERSION}-beta\.([0-9]+)$/\1/" \
                | sort -n \
                | tail -n 1 || true
            )"

            if [[ -z "$LATEST_BETA_NUMBER" ]]; then
              BETA_NUMBER=1
            else
              BETA_NUMBER="$((LATEST_BETA_NUMBER + 1))"
            fi

            RELEASE_VERSION="${BASE_VERSION}-beta.${BETA_NUMBER}"
          else
            RELEASE_VERSION="$BASE_VERSION"
          fi

          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists on origin."
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Current base version: $CURRENT_BASE_VERSION"
          echo "New base version: $BASE_VERSION"
          echo "Release version: $RELEASE_VERSION"

      - name: Update monorepo release.json
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="${{ steps.version.outputs.base_version }}"

          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const path = "release.json";
            const data = JSON.parse(fs.readFileSync(path, "utf8"));

            data.product = data.product || "gryt";
            data.version = version;

            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          ' "$BASE_VERSION"

      - name: Update client package version
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION="${{ steps.version.outputs.version }}"

          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const path = "packages/client/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));

            pkg.version = version;

            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          ' "$RELEASE_VERSION"

          echo "Client package.json version set to $RELEASE_VERSION"
          node -p "require('./packages/client/package.json').version"

      - name: Commit client version bump
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION="${{ steps.version.outputs.version }}"

          git -C packages/client add package.json

          if git -C packages/client diff --cached --quiet; then
            echo "No client package.json changes to commit."
          else
            git -C packages/client commit -m "release: v${RELEASE_VERSION}"
            git -C packages/client push origin "HEAD:main"
          fi

      - name: Create release manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          mkdir -p .release

          CLIENT_SHA="$(git -C packages/client rev-parse HEAD)"
          SERVER_SHA="$(git -C packages/server rev-parse HEAD)"
          SFU_SHA="$(git -C packages/sfu rev-parse HEAD)"
          IMAGE_WORKER_SHA="$(git -C packages/image-worker rev-parse HEAD)"

          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            const [
              version,
              baseVersion,
              channel,
              clientSha,
              serverSha,
              sfuSha,
              imageWorkerSha,
            ] = process.argv.slice(1);

            const manifest = {
              product: "gryt",
              version,
              baseVersion,
              channel,
              monorepoCommit: execSync("git rev-parse HEAD", { encoding: "utf8" }).trim(),
              createdAt: new Date().toISOString(),
              components: {
                client: {
                  repo: "Gryt-chat/client",
                  path: "packages/client",
                  commit: clientSha
                },
                server: {
                  repo: "Gryt-chat/server",
                  path: "packages/server",
                  commit: serverSha
                },
                sfu: {
                  repo: "Gryt-chat/sfu",
                  path: "packages/sfu",
                  commit: sfuSha
                },
                imageWorker: {
                  repo: "Gryt-chat/image-worker",
                  path: "packages/image-worker",
                  commit: imageWorkerSha
                }
              }
            };

            fs.writeFileSync(".release/manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          ' "$VERSION" "$BASE_VERSION" "$CHANNEL" "$CLIENT_SHA" "$SERVER_SHA" "$SFU_SHA" "$IMAGE_WORKER_SHA"

          cat .release/manifest.json

      - name: Commit release metadata and tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # This branch can move under us between checkout and here — a merged PR,
          # or a server release that got past the concurrency group. Rebasing our
          # commit is not enough: release.json is four lines and the server writes
          # "server" while we write "version", so the two hunks overlap and a
          # replay conflicts even though the edits are independent.
          #
          # So re-apply what we own onto whatever the branch holds now, and retry.
          # A reset reverts the tracked manifest, so keep a copy; the packages/client
          # working tree is untouched by the reset, so re-staging it re-records the
          # same commit. The release.json edit matches "Update monorepo release.json"
          # above; keep them in step.
          MANIFEST_BACKUP="${RUNNER_TEMP}/release-manifest.json"
          cp .release/manifest.json "$MANIFEST_BACKUP"

          apply_release_metadata() {
            mkdir -p .release
            cp "$MANIFEST_BACKUP" .release/manifest.json

            node -e '
              const fs = require("fs");
              const version = process.argv[1];
              const path = "release.json";
              const data = JSON.parse(fs.readFileSync(path, "utf8"));

              data.product = data.product || "gryt";
              data.version = version;

              fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
            ' "$BASE_VERSION"
          }

          outcome=""
          for attempt in 1 2 3 4 5; do
            apply_release_metadata
            # Every submodule moved above, so the tag records what was built.
            # build-electron checks out the tag and initialises submodules from
            # its gitlinks: a path left out here is built from whatever main
            # happened to point at, while manifest.json names the commit the
            # release actually chose. That disagreement is the bug #51 fixed for
            # server and sfu, and it applies to the worker for the same reason.
            git add release.json .release/manifest.json \
              packages/client packages/server packages/sfu packages/image-worker

            if git diff --cached --quiet; then
              echo "No release metadata changes to commit."
              outcome="nothing-to-commit"
              break
            fi

            git commit -m "release: v$VERSION ($CHANNEL) [skip ci]"

            if git push origin "HEAD:${BRANCH}"; then
              outcome="pushed"
              break
            fi

            echo "Push rejected (attempt ${attempt}/5) — reapplying onto the current ${BRANCH}."
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            sleep $(( attempt * 5 ))
          done

          if [[ -z "$outcome" ]]; then
            echo "Could not push the release commit after 5 attempts." >&2
            exit 1
          fi

          # Tagged after the push succeeds, so the tag can never name a commit that
          # is not on the branch.
          #
          # Same idempotency as `Tag server repo`: a re-dispatch of a version
          # that already got this far finds its own tag on the remote, and that
          # used to fail the step on "tag already exists". Accept the tag when
          # it already names this commit; refuse to move one that names another.
          # GRYT-300.
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin "refs/tags/v${VERSION}" | awk '{ print $1 }')"

          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$HEAD_SHA" ]]; then
            echo "v${VERSION} already exists on the remote at ${REMOTE_SHA}," >&2
            echo "but this release built ${HEAD_SHA}." >&2
            echo "" >&2
            echo "Refusing to move a published tag. Either delete the remote tag" >&2
            echo "and dispatch again, or release a new version." >&2
            exit 1
          fi

          if [[ -n "$REMOTE_SHA" ]]; then
            echo "v${VERSION} is already on the remote at ${HEAD_SHA}."
          else
            git tag -f "v$VERSION" "$HEAD_SHA"
            git push origin "v$VERSION"
          fi

      - name: Determine checkout ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          echo "checkout_ref=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.channel.outputs.channel }}" == "latest" ]]; then
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          fi

      # Created as a draft so nothing sees it until every platform has uploaded.
      # The builds finish minutes apart — macOS trails Windows by about seven,
      # because it signs and notarises first — and a client that checks in that
      # gap gets a 404 on its own channel file while another platform is already
      # updating happily. The publish-release job below flips it live.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gryt v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          draft: true
          files: .release/manifest.json
          body: |
            Gryt v${{ steps.version.outputs.version }}

            Channel: ${{ steps.channel.outputs.channel }}

            This release was built from the monorepo with pinned submodule commits.

            See `manifest.json` for the exact client, server, SFU and image
            worker commits.
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-electron:
    name: Build Electron app (${{ matrix.os }})
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # Pinned, do not move back to windows-latest without checking first.
          # windows-latest now ships Visual Studio 18, and node-gyp 11.5.0 cannot
          # parse its version — it reports `unknown version "undefined"` and
          # refuses the toolchain even when handed it directly via VCINSTALLDIR.
          # That broke the better-sqlite3 build in the embedded server, verified
          # with windows-build-probe.yml: identical code and step order failed on
          # windows-latest and passed on windows-2022. See GRYT-26.
          #
          # That reason no longer applies. The server and the image worker are on
          # node:sqlite, so node-gyp is out of this workflow entirely and nothing
          # in the embedded server build compiles C++ any more.
          #
          # The pin stays regardless, because it was never tested against what
          # still needs a compiler here: native/build.bat, which builds the audio
          # and screen capture helpers. That uses MSVC directly rather than
          # through node-gyp, so the version-parsing bug probably does not apply
          # — but probably is not tried, and a Windows build that only breaks
          # during a release is an expensive way to find out. Re-run the probe
          # against build.bat before unpinning.
          - windows-2022

    runs-on: ${{ matrix.os }}

    env:
      OWNER: Gryt-chat
      REPO: gryt
      VERSION: ${{ needs.prepare-release.outputs.version }}
      BASE_VERSION: ${{ needs.prepare-release.outputs.base_version }}
      CHANNEL: ${{ needs.prepare-release.outputs.channel }}
      RELEASE_TYPE: ${{ needs.prepare-release.outputs.release_type }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false

      - name: Checkout required submodules
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync -- packages/client packages/server packages/sfu packages/image-worker
          git submodule update --init --force -- packages/client packages/server packages/sfu packages/image-worker

      - name: Checkout AUR submodule
        if: runner.os == 'Linux'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync -- aur
          git submodule update --init --force -- aur

      - name: Verify packaged client version
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="${{ env.VERSION }}"
          ACTUAL="$(node -p "require('./packages/client/package.json').version")"

          echo "Expected client package version: $EXPECTED"
          echo "Actual client package version:   $ACTUAL"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Client package.json version mismatch."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: packages/client/yarn.lock

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: packages/sfu/go.sum

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libgtk-3-dev \
            libgbm-dev \
            rpm

      - name: Install client dependencies
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines

      - name: Generate app icons
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.['icons:generate'] ? 0 : 1)"; then
            yarn icons:generate
          else
            echo "No icons:generate script found, skipping."
          fi

      - name: Install server dependencies
        working-directory: packages/server
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines

      - name: Install SFU dependencies
        working-directory: packages/sfu
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f go.mod ]]; then
            go mod download
          fi

      # build-embedded-server.mjs runs `npm run build` in this directory, and
      # the worker's build script is a bare `tsc`. Without this the compiler
      # isn't on disk and the embedded server build fails on a fresh checkout.
      # The install of the worker's *runtime* dependencies is a separate thing
      # the build script does, into its own output directory.
      - name: Install image worker dependencies
        working-directory: packages/image-worker
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines

      - name: Type-check client
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          npx tsc -b

      - name: Lint client
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0

      # Still required, but no longer for the reason it was added. The embedded
      # server used to run `npm rebuild better-sqlite3 --build-from-source`
      # here, and node-gyp needed the VCINSTALLDIR this action sets. Both the
      # server and the image worker are on node:sqlite now, so nothing in the
      # embedded server build compiles C++ any more.
      #
      # What still needs a toolchain is "Build native Windows binaries" below —
      # native/build.bat compiles the audio and screen capture helpers. Delete
      # this step and that one breaks, so it stays.
      #
      # Whether the windows-2022 pin can be lifted is a separate question. It
      # was pinned because node-gyp 11.5.0 could not parse Visual Studio 18, and
      # node-gyp is no longer in this path — but native/build.bat has not been
      # tried against VS 18. That is what GRYT-26's probe is for.
      - name: Set up MSVC Build Tools Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build embedded server and SFU
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          npm run build:embedded-server

      - name: Verify embedded server dependencies
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f build/embedded-server/server/bundle.js ]]; then
            echo "Missing embedded server bundle.js"
            exit 1
          fi

          if [[ ! -d build/embedded-server/server/node_modules ]]; then
            echo "Missing embedded server node_modules directory."
            exit 1
          fi

          # sharp is what this checks now. better-sqlite3 was the other one, and
          # it is gone: the server and the image worker both moved to
          # node:sqlite, which is part of the runtime and cannot be missing from
          # a bundle. Leaving the old check here would fail every release.
          #
          # sharp is still worth asserting. It ships as a per-platform optional
          # dependency that npm resolves by os/cpu, so a bundle built on the
          # wrong host, or an install that quietly skipped optional deps, gets a
          # server that starts and then throws the first time anyone uploads an
          # image.
          if [[ ! -d build/embedded-server/server/node_modules/sharp ]]; then
            echo "Missing embedded sharp dependency."
            echo "The packaged app will crash with: Cannot find module 'sharp'"
            exit 1
          fi

          if [[ ! -d build/embedded-server/worker/node_modules/sharp ]]; then
            echo "Missing sharp in the image worker bundle."
            echo "Image jobs would queue and never be processed."
            exit 1
          fi

          echo "Embedded server dependencies are present."

      - name: Build native audio Linux
        if: runner.os == 'Linux'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          bash native/audio-capture/build.sh

      - name: Build native audio macOS
        if: runner.os == 'macOS'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          bash native/audio-capture/build.sh

      - name: Build native Windows binaries
        if: runner.os == 'Windows'
        working-directory: packages/client
        shell: cmd
        run: |
          native\build.bat

      - name: Prepare macOS signing keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.MACOS_CERT_P12_BASE64 }}" ]]; then
            echo "MACOS_CERT_P12_BASE64 is not set."
            exit 1
          fi

          if [[ -z "${{ secrets.MACOS_CERT_PASSWORD }}" ]]; then
            echo "MACOS_CERT_PASSWORD is not set."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          echo "${{ secrets.MACOS_CERT_P12_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.MACOS_CERT_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity -v -p codesigning || true

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build Electron app
        working-directory: packages/client
        shell: bash
        env:
          ELECTRON: "1"
        run: |
          set -euo pipefail
          npx vite build

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: runner.os == 'Linux'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        if: runner.os == 'Linux'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ env.VERSION }}"
          CHANNEL="${{ env.CHANNEL }}"
          IMAGE="${{ env.DOCKER_IMAGE }}"

          CLEAN_VERSION="${VERSION%%-*}"
          V_MAJOR="$(echo "$CLEAN_VERSION" | cut -d. -f1)"
          V_MINOR="$(echo "$CLEAN_VERSION" | cut -d. -f2)"

          TAGS=(
            "${IMAGE}:${VERSION}"
            "${IMAGE}:${V_MAJOR}.${V_MINOR}"
            "${IMAGE}:${V_MAJOR}"
          )

          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=("${IMAGE}:latest")
          else
            TAGS+=("${IMAGE}:latest-beta")
          fi

          ARGS=()
          for TAG in "${TAGS[@]}"; do
            ARGS+=(-t "$TAG")
          done

          # A push that reaches GHCR and is refused is usually the secondary
          # rate limit rather than anything about this build. That is what took
          # v1.5.0-beta.1 down: the version tag had already gone up and
          # latest-beta came back 403, so the image was half published.
          #
          # Retried rather than failed, because giving up costs the whole
          # release and not just the tag — this job failing skips Publish
          # release, and the release then sits as a draft nobody can install.
          # Layer cache makes a second attempt cheap.
          pushed=""
          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from type=registry,ref=${IMAGE}:buildcache \
              --cache-to type=registry,ref=${IMAGE}:buildcache,mode=max \
              "${ARGS[@]}" \
              --push \
              .
            then
              pushed="yes"
              break
            fi

            echo "Docker build/push failed (attempt ${attempt}/5) — retrying."
            sleep $(( attempt * 20 ))
          done

          if [[ -z "$pushed" ]]; then
            echo "Could not build and push the image after 5 attempts." >&2
            exit 1
          fi

      - name: Package and publish Electron app
        if: runner.os != 'macOS'
        working-directory: packages/client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
          CHANNEL: ${{ env.CHANNEL }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail

          # The -c.snap.publish.* overrides below are what keeps the snap out
          # of the store from here. electron-builder adds the Snap Store
          # publisher on its own when it finds SNAPCRAFT_STORE_CREDENTIALS, and
          # that upload blocks on the store's review queue — twenty-five
          # minutes on v1.5.8, with publish-release waiting behind it, so a
          # Windows download was held up by a Linux store scan. The .snap is
          # attached to the release like everything else now, and the store
          # push is its own job at the end.
          #
          # Spelled out per key rather than as `-c.snap.publish=github`. The
          # shorthand replaces the publish config for this target instead of
          # extending it, so owner and repo went missing and electron-builder
          # fell back to inferring them from package.json — it tried to create
          # the release in Gryt-chat/client, where this token cannot write, and
          # got a 403 that no retry was ever going to clear. That is what left
          # v1.5.9 a draft with no .snap on it.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            TARGETS="--linux AppImage deb snap"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            TARGETS="--win"
          else
            echo "Unsupported runner OS: $RUNNER_OS"
            exit 1
          fi

          # electron-builder fetches the Electron binary on first use, and
          # app-builder asks for it through DownloadNoRetry — so a connection
          # that drops mid-download fails the build outright with no second
          # attempt. That is what took v1.5.2-beta.1 down on Windows:
          # `Get "…/electron-v40.6.1-win32-x64.zip": EOF`.
          #
          # Three attempts rather than five. A genuine packaging failure repeats
          # the whole build each time, and the download failures seen so far all
          # land in the first minute.
          published=""
          for attempt in 1 2 3; do
            if npx electron-builder \
              $TARGETS \
              --publish always \
              -c.extraMetadata.version="$VERSION" \
              -c.publish.provider=github \
              -c.publish.owner="$OWNER" \
              -c.publish.repo="$REPO" \
              -c.publish.releaseType="$RELEASE_TYPE" \
              -c.snap.publish.provider=github \
              -c.snap.publish.owner="$OWNER" \
              -c.snap.publish.repo="$REPO" \
              -c.snap.publish.releaseType="$RELEASE_TYPE"
            then
              published="yes"
              break
            fi

            echo "electron-builder failed (attempt ${attempt}/3) — retrying."
            sleep $(( attempt * 20 ))
          done

          if [[ -z "$published" ]]; then
            echo "Could not package and publish after 3 attempts." >&2
            exit 1
          fi

      - name: Package macOS app
        if: runner.os == 'macOS'
        working-directory: packages/client
        shell: bash
        env:
          DEBUG: electron-builder,electron-osx-sign,electron-notarize
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" ]]; then
            echo "APPLE_API_KEY_P8_BASE64 is not set."
            exit 1
          fi

          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

          # The publish overrides matter even though this uploads separately with
          # `gh release upload`. electron-builder bakes them into app-update.yml
          # inside the packaged app, which is where the updater reads its repo
          # from. Without them this inherited publish.repo from
          # packages/client/electron-builder.yml, which named the client repo
          # rather than this one, and every shipped macOS build asked an empty
          # repository for updates. The other platforms always passed these,
          # which is why only macOS was broken.
          npx electron-builder \
            --mac \
            --publish never \
            -c.extraMetadata.version="$VERSION" \
            -c.publish.provider=github \
            -c.publish.owner="$OWNER" \
            -c.publish.repo="$REPO"

          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload macOS assets to GitHub Release
        if: runner.os == 'macOS'
        working-directory: packages/client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"

          shopt -s nullglob
          ASSETS=(
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          )
          shopt -u nullglob

          if [[ "${#ASSETS[@]}" -eq 0 ]]; then
            echo "No macOS assets found in packages/client/release/"
            ls -la release || true
            exit 1
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --repo "$OWNER/$REPO" --clobber

  # Runs only after every matrix leg succeeds. `needs` on a matrix job means a
  # single failed platform skips this, which leaves the release as an
  # unpublished draft rather than a half-built release nobody can install —
  # v1.3.1-beta.2 and beta.3 both shipped without Windows assets that way.
  publish-release:
    name: Publish release
    needs: [prepare-release, build-electron]
    runs-on: ubuntu-latest

    env:
      OWNER: Gryt-chat
      REPO: gryt
      VERSION: ${{ needs.prepare-release.outputs.version }}
      CHANNEL: ${{ needs.prepare-release.outputs.channel }}

    steps:
      - name: Verify every platform uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"
          ASSETS="$(gh release view "$TAG" --repo "$OWNER/$REPO" --json assets --jq '.assets[].name')"

          echo "Assets on $TAG:"
          printf '%s\n' "$ASSETS" | sed 's/^/  /'

          # One installer per platform plus the three channel files. A client
          # whose channel file is missing gets a 404 and reports the release as
          # broken, so the channel files matter as much as the installers.
          MISSING=0
          for PATTERN in \
            'win-x64\.exe$' \
            'linux-x86_64\.AppImage$' \
            'mac-arm64\.zip$' \
            '^latest\.yml$' \
            '^latest-linux\.yml$' \
            '^latest-mac\.yml$'
          do
            if ! printf '%s\n' "$ASSETS" | grep -qE "$PATTERN"; then
              echo "::error::No asset matching $PATTERN"
              MISSING=1
            fi
          done

          if [[ "$MISSING" -ne 0 ]]; then
            echo "Leaving $TAG as a draft."
            exit 1
          fi

          echo "All expected assets present."

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release edit "v$VERSION" --repo "$OWNER/$REPO" --draft=false
          echo "Published v$VERSION."

      # Moved here from the Linux build leg. Announcing from there fired while
      # macOS was still signing, so #releases advertised a build that Mac users
      # could not yet install.
      - name: Notify Discord
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL secret not set, skipping"
            exit 0
          fi

          TAG="v$VERSION"
          RELEASE_URL="https://github.com/${OWNER}/${REPO}/releases/tag/${TAG}"

          if [[ "$CHANNEL" == "beta" ]]; then
            TITLE="BETA Client release"
            COLOR=16750848
            DESCRIPTION="New desktop build is available for testing."
          else
            TITLE="STABLE Client release"
            COLOR=5763719
            DESCRIPTION="New desktop build is available."
          fi

          PAYLOAD="$(jq -n \
            --arg title "$TITLE" \
            --arg url "$RELEASE_URL" \
            --arg desc "$DESCRIPTION" \
            --arg version "$VERSION" \
            --arg release "Open release" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: $color,
                fields: [
                  { name: "Version", value: $version, inline: true },
                  { name: "Release", value: ("[" + $release + "](" + $url + ")"), inline: true }
                ],
                footer: { text: "Gryt Client" },
                timestamp: (now | todate)
              }]
            }'
          )"

          curl -sfS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"

  # After the release is out, not before it. The Snap Store scans an upload
  # before it accepts it, and that review has repeatedly taken tens of minutes.
  # Nothing here is on the critical release path: the .snap is already attached
  # to the GitHub release, so this job only decides whether the Store gets the
  # same artifact.
  #
  # The Store has taken 25 minutes, 77 minutes, and sometimes longer to process
  # Gryt uploads. `snapcraft upload --release` waits for that processing rather
  # than returning immediately, so a long-running job here does not necessarily
  # mean the upload is hung.
  publish-snap:
    name: Publish snap to the Snap Store
    needs: [prepare-release, publish-release]
    runs-on: ubuntu-latest

    # Stable only. Every upload waits on the store's automated review, and
    # betas ship often. Linux beta testers already have the AppImage, .deb and
    # .snap attached to the GitHub release, so putting every beta through the
    # Store review queue buys very little.
    #
    # `latest/beta` is closed in the Store to match. Leaving it open but unfed
    # would serve an increasingly stale beta indefinitely.
    if: needs.prepare-release.outputs.channel != 'beta'

    # The Snap Store is not part of the release's availability contract.
    #
    # GitHub, Windows, macOS, AppImage, deb and the downloadable snap have all
    # already shipped by the time this job runs. A Canonical outage, review
    # backlog or timeout must therefore not turn an otherwise successful Gryt
    # release red.
    continue-on-error: true

    # Previous Gryt Store reviews have approached/exceeded the old 90-minute
    # limit. Give Canonical enough room to finish a legitimately slow automated
    # review, while still preventing a genuinely wedged process from occupying
    # a runner indefinitely.
    timeout-minutes: 180

    env:
      OWNER: Gryt-chat
      REPO: gryt
      VERSION: ${{ needs.prepare-release.outputs.version }}

    steps:
      - name: Install Snapcraft
        shell: bash
        run: |
          set -euo pipefail

          sudo snap install snapcraft --classic

          echo "Snapcraft version:"
          snapcraft --version

      - name: Download the snap from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download "v$VERSION" \
            --repo "$OWNER/$REPO" \
            --pattern '*.snap' \
            --dir .

          echo "Downloaded snap:"
          ls -lah ./*.snap

      - name: Upload to the Snap Store
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail

          if [[ -z "${SNAPCRAFT_STORE_CREDENTIALS:-}" ]]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS is not set, skipping the Store."
            exit 0
          fi

          # Always stable: this job does not run for beta releases.
          SNAP="$(find . -maxdepth 1 -type f -name '*.snap' -print -quit)"

          if [[ -z "$SNAP" ]]; then
            echo "::error::No .snap file was downloaded from the GitHub release."
            exit 1
          fi

          echo "Uploading $SNAP to latest/stable."
          echo
          echo "NOTE:"
          echo "  Snapcraft waits for the Snap Store to process/review the upload."
          echo "  Gryt uploads have previously spent tens of minutes in this step."
          echo "  A quiet/long-running command here does not by itself mean it is stuck."
          echo

          # Verbose Store diagnostics are intentional. The previous command
          # could sit silently for an hour and leave us with almost nothing to
          # distinguish a slow Store review from an actual network/API failure.
          snapcraft upload \
            --release=stable \
            --verbosity=debug \
            "$SNAP"

          echo
          echo "Snap Store upload/release completed successfully."