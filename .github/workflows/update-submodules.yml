name: Update Submodules

# Updates submodule gitlinks on main. This used to take a target_branch input
# defaulting to beta, which is where the "chore: update all submodules on beta"
# commits came from. With the beta branch gone there is only one target left, so
# the input would be a choice of one.

on:
  # How this normally runs: each submodule repo pings us when something lands on
  # its main, and the pointer moves within seconds.
  repository_dispatch:
    types: [submodule-updated]

  # Backstop only. GitHub throttles scheduled runs on quiet repositories — this
  # was set to every 15 minutes and delivered one run in two hours — so the
  # schedule cannot be the primary trigger. Hourly is enough to catch a dispatch
  # that never arrived.
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      submodules:
        description: "Submodules to update"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - client
          - server
          - sfu
          - image-worker
          - docs
          - site
          - auth
          - ui
          - cli
          - voice
          - mobile
          - bot

permissions:
  contents: write

concurrency:
  # This used to share the `release-${{ github.ref }}` group with both release
  # workflows, on the grounds that a third unattended writer to main would race
  # them for the push. It does race them — but the push below already handles
  # that itself, retrying five times and re-pointing the submodules against
  # whatever main has become. The shared group was guarding something that no
  # longer needs guarding, and it cost more than it gave: GitHub keeps only one
  # pending run per group, so a burst of merges left queued sweeps cancelling
  # each other, the hourly backstop included. Three gitlinks sat stale on
  # 2026-08-06 because of it.
  group: submodule-sweep-${{ github.ref }}

  # Safe to cancel, because the sweep is idempotent — it points every submodule
  # at its current main, so the newest run alone produces the same result as
  # running all of them in order. During a burst this collapses to one run
  # instead of a queue where only the last survives anyway.
  cancel-in-progress: true

jobs:
  update-submodules:
    name: Update submodule pointers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Deliberately not `submodules: recursive`. That clones each submodule
          # at the recorded gitlink, so a pointer at a commit which is not on the
          # remote — an unpushed local commit, a force-pushed branch — kills the
          # checkout before this job reaches the code that would repair it. That
          # happened on 2026-08-06 and needed a manual fix. The job re-points
          # every submodule anyway, so the recorded SHA is of no use here.
          submodules: false

      - name: Set up Git user
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Initialize top-level submodules
        shell: bash
        run: |
          set -euo pipefail

          SUBMODULES="packages/client packages/server packages/sfu packages/image-worker packages/docs packages/site packages/auth packages/ui packages/cli packages/voice packages/mobile packages/bot"

          # Clone straight from the URL rather than `git submodule update`,
          # which insists on the recorded gitlink and so fails on a broken one.
          # Nothing here reads that SHA — each submodule is moved to its own
          # origin/main a moment later.
          for path in $SUBMODULES; do
            if [[ -e "$path/.git" ]]; then
              continue
            fi

            name=$(git config -f .gitmodules --get-regexp '\.path$' \
              | awk -v p="$path" '$2 == p { print $1 }' \
              | sed 's/^submodule\.//; s/\.path$//')
            url=$(git config -f .gitmodules --get "submodule.${name}.url")

            if [[ -z "$url" ]]; then
              echo "No URL in .gitmodules for $path — skipping."
              continue
            fi

            echo "Cloning $path from $url"
            rm -rf "$path"
            git clone --quiet "$url" "$path"
          done

          git submodule sync -- $SUBMODULES

      - name: Update selected submodules
        shell: bash
        run: |
          set -euo pipefail

          SELECTED="${{ github.event.inputs.submodules || 'all' }}"
          TARGET_BRANCH="main"
          DEFAULT_SUBMODULE_BRANCH="main"

          update_submodule() {
            local path="$1"
            local branch="$2"

            if [[ ! -d "$path" ]]; then
              echo "Skipping missing submodule: $path"
              return 0
            fi

            echo "Updating $path"

            git -C "$path" fetch origin --tags

            echo "Using branch $branch for $path"

            git -C "$path" checkout -B "$branch" "origin/$branch"
            git -C "$path" pull --ff-only origin "$branch"

            git add "$path"
          }

          if [[ "$SELECTED" == "all" || "$SELECTED" == "client" ]]; then
            update_submodule "packages/client" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "server" ]]; then
            update_submodule "packages/server" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "sfu" ]]; then
            update_submodule "packages/sfu" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "image-worker" ]]; then
            update_submodule "packages/image-worker" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          # docs, site and auth were missing here, so their pointers only ever
          # moved when someone did it by hand. That is why docs and site had to
          # be bumped manually during the llms.txt work.
          if [[ "$SELECTED" == "all" || "$SELECTED" == "docs" ]]; then
            update_submodule "packages/docs" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "site" ]]; then
            update_submodule "packages/site" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "auth" ]]; then
            update_submodule "packages/auth" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "ui" ]]; then
            update_submodule "packages/ui" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "cli" ]]; then
            update_submodule "packages/cli" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "voice" ]]; then
            update_submodule "packages/voice" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "mobile" ]]; then
            update_submodule "packages/mobile" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "bot" ]]; then
            update_submodule "packages/bot" "$DEFAULT_SUBMODULE_BRANCH"
          fi

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No submodule updates."
            exit 0
          fi

          TARGET_BRANCH="main"
          SELECTED="${{ github.event.inputs.submodules || 'all' }}"

          # [skip ci] because a pointer move is not a code change and should not
          # kick off the other workflows.
          git commit -m "chore: update $SELECTED submodules on $TARGET_BRANCH [skip ci]"

          # main can move under us — a merged PR, or a release commit that got
          # past the concurrency group. Nothing here is worth rebasing: on a
          # rejection, take the branch as it now stands and re-point the
          # submodules at their current tips, which is the whole job anyway.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}/5) — redoing on the current ${TARGET_BRANCH}."
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            # Every submodule, not most of them. mobile was missing, so a
            # rejected push rebuilt the commit without it and silently dropped
            # whatever bump had just been made.
            for path in packages/client packages/server packages/sfu packages/image-worker packages/docs packages/site packages/auth packages/ui packages/cli packages/voice packages/mobile packages/bot; do
              [[ -d "$path" ]] || continue
              git -C "$path" fetch origin main
              git -C "$path" checkout -B main origin/main
              git add "$path"
            done

            if git diff --cached --quiet; then
              echo "Nothing left to update after refresh."
              exit 0
            fi

            git commit -m "chore: update $SELECTED submodules on $TARGET_BRANCH [skip ci]"
            sleep $(( attempt * 5 ))
          done

          echo "Could not push the submodule update after 5 attempts." >&2
          exit 1
