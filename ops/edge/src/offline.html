<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Gryt is down</title>
    <style>
      /* Hallmark · macrostructure: Manifesto (poster, one screen) · genre: modern-minimal
       * design-system: packages/ui/design.md · theme: @gryt/ui dark half, inlined
       * tone: utilitarian · anchor hue: gryt violet · enrichment: the hard-hat owl
       * pre-emit critique: P5 H5 E5 S4 R5 V4
       */

      :root {
        color-scheme: dark;

        --color-paper: #111318;
        --color-paper-2: #1a1d24;
        --color-paper-3: #1e2028;
        --color-paper-hover: #334155;
        --color-ink: #e0e0e6;
        --color-ink-2: #888888;
        --color-rule: #2b303d;
        --color-accent: #968ff8;
        --color-accent-ink: #0c0a20;
        --color-focus: #b4afff;

        --color-warn-paper: #30250e;
        --color-warn-rule: #513c06;
        --color-warn-ink: #f8d17f;
        --color-warn: #fbbf24;

        --color-owl-body: #a495e3;
        --color-owl-wing: #7c6ec3;
        --color-owl-face: #c3c1ff;
        --color-owl-ink: #2e2d5f;
        --color-hat: #fed842;
        --color-hat-brim: #fdc62a;
        --color-hat-shade: #fab01e;
        --color-hat-rib: #f9ae1c;

        --font-sans: Inter, ui-sans-serif, system-ui, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

        --space-3xs: 0.375rem;
        --space-2xs: 0.5rem;
        --space-xs: 0.75rem;
        --space-sm: 1rem;
        --space-md: 1.5rem;
        --space-lg: 2rem;
        --space-xl: 3rem;

        --text-sm: 0.875rem;
        --text-md: 1.0625rem;
        --text-display: clamp(2.25rem, 4vw + 0.75rem, 3.5rem);

        --radius-md: 12px;
        --radius-lg: 20px;
        --radius-full: 999px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --dur-short: 180ms;
      }

      *,
      *::before,
      *::after { box-sizing: border-box; }

      html,
      body { overflow-x: clip; }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--color-paper);
        color: var(--color-ink);
        font-family: var(--font-sans);
        font-size: var(--text-md);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      /* @gryt/ui Chip, warning tone. */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--space-3xs);
        padding: 0.25rem var(--space-xs);
        border: 1px solid var(--color-warn-rule);
        border-radius: var(--radius-full);
        background: var(--color-warn-paper);
        color: var(--color-warn-ink);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1.4;
      }

      .chip svg { width: 14px; height: 14px; flex: none; }

      h1 {
        margin: 0;
        font-size: var(--text-display);
        font-weight: 600;
        letter-spacing: -0.022em;
        line-height: 1.08;
        text-wrap: balance;
        overflow-wrap: anywhere;
        min-width: 0;
      }

      .lede { margin: 0; color: var(--color-ink-2); text-wrap: pretty; }

      /* @gryt/ui Button, medium. */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2xs);
        min-height: 2.5rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: var(--radius-full);
        font-size: var(--text-sm);
        font-weight: 600;
        white-space: nowrap;
        text-decoration: none;
        transition: scale var(--dur-short) var(--ease-out),
          background-color var(--dur-short) var(--ease-out);
      }

      .btn--accent { background: var(--color-accent); color: var(--color-accent-ink); }
      .btn--accent:hover { background: var(--color-focus); }
      .btn--neutral { background: var(--color-paper-3); color: var(--color-ink); }
      .btn--neutral:hover { background: var(--color-paper-hover); }
      .btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

      @media (prefers-reduced-motion: no-preference) {
        .btn:hover { scale: 1.03; }
        .btn:active { scale: 0.96; }
      }

      .actions { display: flex; flex-wrap: wrap; gap: var(--space-2xs); }

      /* The axis is broken at the foot: the status row runs edge to edge under a
         hairline, so the centred stack is not the only alignment on the page. */
      body { display: grid; grid-template-rows: 1fr auto; }

      .poster {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: var(--space-md);
        text-align: center;
        padding: var(--space-xl) var(--space-md);
        max-width: 40rem;
        margin: 0 auto;
      }

      .poster .mark { width: clamp(120px, 22vw, 168px); height: auto; }
      .poster h1 { margin-top: var(--space-2xs); }
      .poster .lede { max-width: 32rem; }

      .footrow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-md);
        border-top: 1px solid var(--color-rule);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--color-ink-2);
      }
    </style>
  </head>
