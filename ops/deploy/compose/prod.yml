name: gryt-prod

services:
  server-data-init:
    image: alpine:3
    container_name: gryt-prod-server-data-init
    command: ["/bin/sh", "-c", "mkdir -p /data && chown -R 1001:1001 /data"]
    volumes:
      - gryt-prod-server-data:/data
    networks:
      - gryt-prod
    restart: "no"

  # ── Moving off MinIO ──────────────────────────────────────────────────────
  # Copies uploads out of the old MinIO volume on the first start, then checks them.
  # Later starts see the marker in /data/gryt and exit at once.
  storage-migrate:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: gryt-prod-storage-migrate
    network_mode: none
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -uo pipefail
        say() { echo "storage-migrate: $$*"; }
        fail() { say "$$*"; exit 1; }
        data=/gryt-data out=/gryt-data/gryt old=/data bucket=$${OLD_S3_BUCKET:-gryt}
        marker=$$out/.migrated-from-minio
        mark() { mkdir -p "$$out" && echo "$$(date -u +%FT%TZ) $$1" > "$$marker" && chown 1001:1001 "$$data" "$$out" "$$marker"; }

        # 1 and 2: done before, or nothing to move. Both have to stay fast.
        if [ -f "$$marker" ]; then say "Already done: $$(cat "$$marker")"; exit 0; fi
        if [ ! -f "$$old/.minio.sys/format.json" ]; then
          mark "no MinIO data to move" || fail "Couldn't write $$marker."
          say "No MinIO data in the old volume, so there's nothing to move."; exit 0
        fi

        # 3: files already here and MinIO has data too. Guessing which one wins could lose uploads.
        shopt -s globstar dotglob nullglob
        found=0; for f in "$$out"/**; do [ -f "$$f" ] && found=$$((found + 1)); done
        if [ "$$found" -gt 0 ]; then
          say "Stopped: /data/gryt already has $$found files, and the old MinIO volume has data as well."
          say "If they're left from a migration that failed, delete /data/gryt and start the stack again."
          say "If you copied the uploads over yourself, create /data/gryt/.migrated-from-minio instead."
          fail "Steps: https://docs.gryt.chat/docs/host/docker-compose#moving-off-minio"
        fi

        user=$${MINIO_ROOT_USER:-} pass=$${MINIO_ROOT_PASSWORD:-}
        if [ -z "$$user" ] || [ -z "$$pass" ]; then
          say "MINIO_ROOT_USER or MINIO_ROOT_PASSWORD isn't set in .env, so trying MinIO's default login."
          user=$${user:-minioadmin} pass=$${pass:-minioadmin}
        fi
        say "Found MinIO data. Copying bucket $$bucket into /data/gryt. The old volume is read-only and stays as it is."
        minio_on() {
          MINIO_ROOT_USER=$$user MINIO_ROOT_PASSWORD=$$pass minio server "$$1" \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 > /tmp/minio.log 2>&1 &
          pid=$$!
          for _ in $$(seq 120); do
            timeout 2 mc ready local > /dev/null 2>&1 && return 0
            kill -0 "$$pid" 2> /dev/null || return 1
            sleep 1
          done
          kill "$$pid"; return 1
        }
        # At /data, the path the old stack used, MinIO has nothing to rewrite. A version
        # that still wants to write gets a copy inside this container instead.
        if ! minio_on "$$old"; then
          tail -n 5 /tmp/minio.log
          read -r _ _ _ room _ < <(df -Pk /tmp | tail -n 1)
          [ "$$room" -gt $$(($$(du -sk "$$old" | cut -f1) + 102400)) ] || fail "MinIO won't start on the read-only volume, and there's no room to copy it."
          say "MinIO won't start read-only, so copying its volume into this container first."
          mkdir -p /tmp/minio-copy && cp -a "$$old/." /tmp/minio-copy/ && minio_on /tmp/minio-copy || { cat /tmp/minio.log; fail "The old MinIO didn't start. Its log is above."; }
        fi
        mc alias set old http://127.0.0.1:9000 "$$user" "$$pass" > /dev/null 2>&1 \
          || fail "The old MinIO refused the login. Set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in .env to what it used."

        buckets=$$(mc ls --json old) || fail "Couldn't list the old MinIO's buckets."
        if [[ $$buckets != *"\"key\":\"$$bucket/\""* ]]; then
          [[ $$buckets == *'"key":'* ]] && fail "The old MinIO has no bucket called $$bucket. Set S3_BUCKET in .env to the one Gryt used: $$(mc ls old)"
          mark "the old MinIO had no buckets" || fail "Couldn't write $$marker."
          say "The old MinIO has no buckets, so there's nothing to move."; exit 0
        fi

        # An empty bucket has nothing to stat, and `mc stat -r` fails on it.
        listing=$$(mc ls -r "old/$$bucket") || fail "Couldn't list bucket $$bucket."
        if [ -z "$$listing" ]; then
          mark "bucket $$bucket was empty" || fail "Couldn't write $$marker."
          say "Bucket $$bucket is empty, so there's nothing to move."; exit 0
        fi
        mc stat -r --json "old/$$bucket" > /tmp/objects || fail "Couldn't list bucket $$bucket."
        keys=() types=() bytes=0
        while IFS= read -r line; do
          [[ $$line == *'"status":"success"'* && $$line =~ \"name\":\"([^\"]*)\" ]] || fail "Couldn't read the listing: $$line"
          key=$${BASH_REMATCH[1]#"$$bucket/"} type=""
          [[ $$line =~ \"Content-Type\":\"([^\"]*)\" ]] && type=$${BASH_REMATCH[1]}
          [[ $$line =~ \"size\":([0-9]+) ]] && bytes=$$((bytes + BASH_REMATCH[1]))
          if [[ $$line == *'\'* || $$key == *.meta || $$key == /* || $$key == *..* ]]; then
            fail "The key $$key can't be stored as a file. Nothing was copied."
          fi
          keys+=("$$key") types+=("$$type")
        done < /tmp/objects
        total=$${#keys[@]} mb=$$((bytes / 1048576))
        if [ "$$total" -eq 0 ]; then
          mark "bucket $$bucket was empty" || fail "Couldn't write $$marker."
          say "Bucket $$bucket is empty, so there's nothing to move."; exit 0
        fi
        read -r _ _ _ free _ < <(df -Pk "$$data" | tail -n 1)
        [ "$$free" -gt $$((bytes / 1024 + 10240)) ] || fail "Not enough space: $$mb MB to copy and $$((free / 1024)) MB free."

        say "Copying $$total objects, $$mb MB..."
        mc mirror --quiet "old/$$bucket" "$$out" > /tmp/mirror.log 2>&1 \
          || { tail -n 20 /tmp/mirror.log; fail "The copy failed. Delete /data/gryt before trying again."; }
        for i in "$${!keys[@]}"; do
          [ -z "$${types[i]}" ] || printf '{"contentType":"%s"}' "$${types[i]}" > "$$out/$${keys[i]}.meta" \
            || fail "Couldn't write the content type for $${keys[i]}."
        done

        say "Checking the SHA-256 of every object against the old MinIO..."
        for i in "$${!keys[@]}"; do
          key=$${keys[i]}
          a=$$(mc cat "old/$$bucket/$$key" | sha256sum) || fail "Couldn't read $$key back from the old MinIO."
          b=$$(sha256sum < "$$out/$$key") || b=missing
          [ "$${a%% *}" = "$${b%% *}" ] || fail "The copy of $$key doesn't match the original, so the server won't start. Delete /data/gryt and start the stack again."
          if [ -n "$${types[i]}" ] && [ "$$(cat "$$out/$$key.meta")" != "{\"contentType\":\"$${types[i]}\"}" ]; then
            fail "The content type for $$key didn't save."
          fi
        done
        copied=0; for f in "$$out"/**; do [[ -f $$f && $$f != *.meta ]] && copied=$$((copied + 1)); done
        [ "$$copied" -eq "$$total" ] || fail "MinIO has $$total objects and /data/gryt has $$copied files. Delete /data/gryt and start the stack again."

        chown -R 1001:1001 "$$out" && mark "copied $$total objects, $$mb MB, from bucket $$bucket" || fail "Couldn't write $$marker."
        say "Done in $${SECONDS}s: $$total objects and $$mb MB copied, every SHA-256 matches. You can delete the old volume once a backup has run."
    environment:
      OLD_S3_BUCKET: ${S3_BUCKET:-gryt}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      # The old stack's volume, at the path it had. Empty on a new install.
      - gryt-prod-minio-data:/data:ro
      - gryt-prod-server-data:/gryt-data
    depends_on:
      server-data-init:
        condition: service_completed_successfully
    restart: "no"

  # ── SFU (Media Server) ────────────────────────────────────────────────────
  sfu:
    image: ghcr.io/gryt-chat/sfu:${SFU_VERSION:-latest}
    container_name: gryt-prod-sfu
    ports:
      - "${SFU_PORT:-5005}:5005"
      - "${ICE_UDP_MUX_PORT:-3478}:${ICE_UDP_MUX_PORT:-3478}/udp"
      # Loopback only. The server below runs with host networking, so it cannot
      # reach a container port at all unless that port is published somewhere.
      - "127.0.0.1:${SFU_CONTROL_PORT:-9092}:${SFU_CONTROL_PORT:-9092}"
    environment:
      PORT: "5005"
      # Registration. Published to loopback and no further: the port above is
      # public, and a public /server lets anyone use this SFU as their relay.
      SFU_CONTROL_PORT: "${SFU_CONTROL_PORT:-9092}"
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      ICE_UDP_MUX_PORT: ${ICE_UDP_MUX_PORT:-3478}
      ICE_ADVERTISE_IP: ${ICE_ADVERTISE_IP:-}
      DISABLE_STUN: ${DISABLE_STUN:-false}
      SFU_REQUIRE_CLIENT_TOKEN: ${SFU_REQUIRE_CLIENT_TOKEN:-}
      SFU_METRICS_PORT: ${SFU_METRICS_PORT:-9091}
      MAX_PEERS: ${MAX_PEERS:-}
    networks:
      - gryt-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Signaling Server ───────────────────────────────────────────────────────
  # Host networking for LAN discovery via avahi. The /etc/avahi/services mount
  # needs `chmod o+w /etc/avahi/services` on the host.
  server:
    image: ghcr.io/gryt-chat/server:${SERVER_VERSION:-latest}
    container_name: gryt-prod-server
    # Waits for storage-migrate's marker, even when started alone with --no-deps,
    # so it never serves an empty uploads folder while MinIO still has the files.
    command: ["sh", "-c", "m=/data/gryt/.migrated-from-minio; test -f $$m || echo 'Waiting for storage-migrate to move uploads off MinIO. Start the whole stack: docker compose up -d'; until test -f $$m; do sleep 5; done; exec node bundle.js"]
    network_mode: host
    extra_hosts:
      - "sfu:127.0.0.1"
    environment:
      PORT: ${SERVER_PORT:-5000}
      HOST: "0.0.0.0"
      NODE_ENV: production
      SERVER_NAME: ${SERVER_NAME:-My Gryt Server}
      # Loopback because the server has host networking and the worker publishes
      # there. Unset means no worker version is shown.
      IMAGE_WORKER_URL: http://127.0.0.1:${IMAGE_WORKER_HEALTH_PORT:-8081}
      SERVER_DESCRIPTION: ${SERVER_DESCRIPTION:-A Gryt voice chat server}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      MDNS_INTERFACE: ${MDNS_INTERFACE:-}
      METRICS_PORT: ${METRICS_PORT:-9091}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:15738,https://app.gryt.chat}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # The websocket port, not the control port. An SFU that has moved registration
      # refuses here and names the port to move to, and the server follows that.

      # So this works against an SFU that serves registration here and one that does
      # not, which is what keeps an upgrade from needing the two changed together.
      SFU_WS_HOST: ws://127.0.0.1:${SFU_PORT:-5005}
      SFU_PUBLIC_HOST: ${SFU_PUBLIC_HOST:-ws://localhost:5005}
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      VOICE_MAX_USERS: ${VOICE_MAX_USERS:-}
      GRYT_SERVER_ENABLED: ${GRYT_SERVER_ENABLED:-${GRYT_AUTH_MODE:-true}}
      GRYT_OIDC_ISSUER: ${GRYT_OIDC_ISSUER:-https://auth.gryt.chat/realms/gryt}
      GRYT_OIDC_AUDIENCE: ${GRYT_OIDC_AUDIENCE:-gryt-web}
      # Which identities this server admits. Add "local" to let people
      # join without a Gryt account — see docs.gryt.chat, Server → Identity.
      GRYT_IDENTITY_TIERS: ${GRYT_IDENTITY_TIERS:-account}
      # Which CA an identity may have been signed by. Here rather than only in
      # the server's default, so it can be pointed elsewhere without a code change.
      GRYT_TRUSTED_CERT_ISSUERS: ${GRYT_TRUSTED_CERT_ISSUERS:-https://id.gryt.chat}
      # How many people one invite may admit per hour.
      GRYT_INVITE_MAX_JOINS_PER_HOUR: ${GRYT_INVITE_MAX_JOINS_PER_HOUR:-60}
      # How many proxies in front may be believed about who a client is. One: the
      # Cloudflare tunnel appends the visitor to the right of x-forwarded-for.

      # Unset is not neutral — the server falls back to the tunnel's own address,
      # so every client shares a rate-limit bucket and the invite lockout goes wide.
      GRYT_TRUSTED_PROXY_HOPS: ${GRYT_TRUSTED_PROXY_HOPS:-1}
      DATA_DIR: /data
      # Uploads go in /data/gryt, beside the database, and the image worker mounts
      # the same volume. storage-migrate moves an older install's uploads there.
      STORAGE_BACKEND: filesystem
      S3_BUCKET: gryt
    volumes:
      - gryt-prod-server-data:/data
      - /etc/avahi/services:/etc/avahi/services
    depends_on:
      sfu:
        condition: service_healthy
      server-data-init:
        condition: service_completed_successfully
      storage-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(`http://localhost:$${process.env.PORT}/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Image Worker ──────────────────────────────────────────────────────────
  image-worker:
    image: ghcr.io/gryt-chat/image-worker:${IMAGE_WORKER_VERSION:-latest}
    container_name: gryt-prod-image-worker
    # The server has host networking, so it cannot reach this container by service
    # name. Bound to loopback: a health endpoint for the server beside it.

    # The default differs per stack on purpose. Four workers run on one Docker
    # host, and a shared default means one fails to publish or answers for another.
    ports:
      - "127.0.0.1:${IMAGE_WORKER_HEALTH_PORT:-8081}:8080"
    environment:
      DATA_DIR: /data
      STORAGE_BACKEND: filesystem
      S3_BUCKET: gryt
    volumes:
      - gryt-prod-server-data:/data
    depends_on:
      server:
        condition: service_healthy
      storage-migrate:
        condition: service_completed_successfully
    networks:
      - gryt-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ── A second server (optional) ────────────────────────────────────────────
  # One compose file can run as many Gryt servers as you like. Each needs its own
  # data volume, SERVER_NAME, PORT and worker; the SFU is shared.

  # Two servers sharing one gryt.db corrupt each other, and the SFU keys voice
  # rooms on SERVER_NAME, so a duplicate stops the second server's voice starting.

  # Only one host-networked server can advertise on the LAN — the avahi service
  # file has a fixed name. docs.gryt.chat → Deployment → Docker Compose.

  # check-comment-length: off
  # server-2:
  #   image: ghcr.io/gryt-chat/server:${SERVER_VERSION:-latest}
  #   container_name: gryt-prod-server-2
  #   network_mode: host
  #   extra_hosts:
  #     - "sfu:127.0.0.1"
  #   environment:
  #     PORT: ${SERVER2_PORT:-5010}
  #     HOST: "0.0.0.0"
  #     NODE_ENV: production
  #     SERVER_NAME: ${SERVER2_NAME:-My Second Gryt Server}
  #     SERVER_DESCRIPTION: ${SERVER2_DESCRIPTION:-Another Gryt voice chat server}
  #     SERVER_PASSWORD: ${SERVER2_PASSWORD:-}
  #     IMAGE_WORKER_URL: http://127.0.0.1:${IMAGE_WORKER2_HEALTH_PORT:-8082}
  #     CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:15738,https://app.gryt.chat}
  #     # Its own secret. Tokens are bound to the host that issued them, so
  #     # sharing one is not exploitable — but there is no reason to.
  #     JWT_SECRET: ${JWT_SECRET_2:?Set JWT_SECRET_2 in .env}
  #     # The same SFU as the first server, on purpose.
  #     SFU_WS_HOST: ws://sfu:${SFU_CONTROL_PORT:-9092}
  #     SFU_PUBLIC_HOST: ${SFU_PUBLIC_HOST:-ws://localhost:5005}
  #     STUN_SERVERS: ${STUN_SERVERS:-stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
  #     GRYT_SERVER_ENABLED: ${GRYT_SERVER_ENABLED:-${GRYT_AUTH_MODE:-true}}
  #     GRYT_OIDC_ISSUER: ${GRYT_OIDC_ISSUER:-https://auth.gryt.chat/realms/gryt}
  #     GRYT_OIDC_AUDIENCE: ${GRYT_OIDC_AUDIENCE:-gryt-web}
  #     GRYT_IDENTITY_TIERS: ${GRYT_IDENTITY_TIERS:-account}
  #     GRYT_TRUSTED_CERT_ISSUERS: ${GRYT_TRUSTED_CERT_ISSUERS:-https://id.gryt.chat}
  #     GRYT_INVITE_MAX_JOINS_PER_HOUR: ${GRYT_INVITE_MAX_JOINS_PER_HOUR:-60}
  #     GRYT_TRUSTED_PROXY_HOPS: ${GRYT_TRUSTED_PROXY_HOPS:-1}
  #     DATA_DIR: /data
  #     STORAGE_BACKEND: filesystem
  #     S3_BUCKET: gryt
  #   volumes:
  #     - gryt-prod-server-2-data:/data
  #   depends_on:
  #     sfu:
  #       condition: service_healthy
  #     server-2-data-init:
  #       condition: service_completed_successfully
  #     storage-migrate-2:
  #       condition: service_completed_successfully
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "node", "-e", "fetch(`http://localhost:$${process.env.PORT}/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  ##
  ## Only matters if server-2 ran on MinIO before: the two shared a bucket, so it
  ## gets its own copy of all of it. On a new second server it does nothing.
  # storage-migrate-2:
  #   extends: storage-migrate
  #   container_name: gryt-prod-storage-migrate-2
  #   volumes:
  #     - gryt-prod-server-2-data:/gryt-data
  #   depends_on:
  #     storage-migrate:
  #       condition: service_completed_successfully
  ##
  # server-2-data-init:
  #   image: alpine:3
  #   container_name: gryt-prod-server-2-data-init
  #   command: ["/bin/sh", "-c", "mkdir -p /data && chown -R 1001:1001 /data"]
  #   volumes:
  #     - gryt-prod-server-2-data:/data
  #   networks:
  #     - gryt-prod
  #   restart: "no"
  ##
  ## A worker serves exactly one server, because it reads exactly one DATA_DIR.
  ## Leaving it out is a supported choice: uploads still work, and what is lost
  ## is thumbnails, recompression and the dominant colour behind voice tiles.
  # image-worker-2:
  #   image: ghcr.io/gryt-chat/image-worker:${IMAGE_WORKER_VERSION:-latest}
  #   container_name: gryt-prod-image-worker-2
  #   ports:
  #     - "127.0.0.1:${IMAGE_WORKER2_HEALTH_PORT:-8082}:8080"
  #   environment:
  #     DATA_DIR: /data
  #     STORAGE_BACKEND: filesystem
  #     S3_BUCKET: gryt
  #   volumes:
  #     - gryt-prod-server-2-data:/data
  #   depends_on:
  #     server-2:
  #       condition: service_healthy
  #   networks:
  #     - gryt-prod
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  #     interval: 30s
  #     timeout: 3s
  #     retries: 3
  #     start_period: 10s
  # check-comment-length: on

  # ── Web Client (dev / local only) ─────────────────────────────────────────
  # Only official Gryt domains are whitelisted as redirect URIs, so this needs
  # your own Keycloak. Enable with `docker compose --profile web up -d`.
  client:
    image: ghcr.io/gryt-chat/client:${CLIENT_VERSION:-latest}
    container_name: gryt-prod-client
    profiles: ["web"]
    ports:
      - "${CLIENT_PORT:-3666}:80"
    # Optional: a host directory of addon folders, each with an addon.json.

    # volumes:
    #   - ./addons:/addons:ro
    environment:
      GRYT_OIDC_ISSUER: ${GRYT_OIDC_ISSUER:-https://auth.gryt.chat/realms/gryt}
      GRYT_OIDC_REALM: ${GRYT_OIDC_REALM:-gryt}
      GRYT_OIDC_CLIENT_ID: ${GRYT_OIDC_CLIENT_ID:-gryt-web}
      # The CA the client asks to vouch for its key, and the counterpart to the
      # server's GRYT_TRUSTED_CERT_ISSUERS above. Move one and the join fails.

      # A different Keycloak with this left alone is GRYT-156. The 401 reads "no
      # applicable key found in the JWKS", which is the symptom.
      GRYT_IDENTITY_URL: ${GRYT_IDENTITY_URL:-https://id.gryt.chat}
      GRYT_AUTH_API: ${GRYT_AUTH_API:-https://auth.gryt.chat}
      GRYT_AUTH_CALLBACK_URL: ${GRYT_AUTH_CALLBACK_URL:-https://gryt.chat/auth/callback}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - gryt-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Monitoring (optional) ──────────────────────────────────────────────────
  # Enable with: docker compose --profile monitoring up -d

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: gryt-prod-prometheus
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "server:host-gateway"
    volumes:
      - gryt-prod-prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/prometheus.yml <<'CFG'
        global:
          scrape_interval: 15s
        scrape_configs:
          # 9091, not 5000: metrics moved off the port the world talks to, so a
          # deployment behind a proxy does not serve its register to strangers.
          - job_name: gryt-server
            static_configs:
              - targets: ["server:${METRICS_PORT:-9091}"]
          - job_name: gryt-sfu
            static_configs:
              - targets: ["sfu:${SFU_METRICS_PORT:-9091}"]
        CFG
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
    networks:
      - gryt-prod
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: gryt-prod-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/gryt-overview.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - gryt-prod-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - gryt-prod
    restart: unless-stopped

networks:
  gryt-prod:
    driver: bridge

volumes:
  gryt-prod-server-data:
  # Only read, by storage-migrate. Delete it once a backup has run without it.
  gryt-prod-minio-data:
  ## Uncomment alongside the server-2 block above.
  # gryt-prod-server-2-data:
  gryt-prod-prometheus-data:
  gryt-prod-grafana-data:
