name: Discord CI notification

# Reports failed workflow runs to #ci in Discord, and the recovery when one goes
# green. Implementation lives in Gryt-chat/.github; needs DISCORD_CI_WEBHOOK_URL.

# Workflows are listed by name rather than left to a wildcard, because an unlisted
# one notifies nobody. Add new workflows here as you add them.

on:
  workflow_run:
    workflows:
      - API reference
      - Avatar parity
      - Permission labels
      - Publish snap to the Snap Store
      - Publish the Homebrew cask
      - Publish to the AUR
      - Publish to winget
      - Release Client
      - Release Server
      - Repo checks
      - Store auth check
      - Store cancel pending submission
      - Sync Vikunja task
      - Update Submodules
    types: [completed]

jobs:
  notify:
    uses: Gryt-chat/.github/.github/workflows/discord-ci-notify.yml@main
    secrets: inherit
