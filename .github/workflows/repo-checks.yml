name: Repo checks

# Small checks on things nothing else reads: the skills CLAUDE.md requires, the
# winget manifests, otherwise only validated at submission, and the Homebrew cask.

# The cask's arch stanza fails at the point somebody opens the app. It also checks
# that every publisher is actually dispatched by a release.

on:
  pull_request:
    paths:
      - .claude/CLAUDE.md
      - .claude/skills/**
      - packaging/winget/**
      - packaging/homebrew/**
      - .github/scripts/check-skills-shipped.mjs
      - .github/scripts/check-winget-manifests.mjs
      - .github/scripts/check-homebrew-casks.mjs
      - .github/scripts/check-publishers-dispatched.mjs
      - .github/scripts/check-offline-page.mjs
      - ops/edge/**
      - .github/workflows/publish-*.yml
      - .github/workflows/release-client.yml
      - .github/workflows/repo-checks.yml
      - ops/**
      - .github/scripts/**
      - .github/workflows/**

  push:
    branches: [main]
    paths:
      - .claude/CLAUDE.md
      - .claude/skills/**
      - packaging/winget/**
      - packaging/homebrew/**
      - .github/workflows/publish-*.yml
      - .github/workflows/release-client.yml
      - ops/**
      - .github/scripts/**
      - .github/workflows/**

  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/check-skills-shipped.mjs
      - run: node .github/scripts/check-winget-manifests.mjs
      - run: node .github/scripts/check-homebrew-casks.mjs
      - run: node .github/scripts/check-publishers-dispatched.mjs
      - run: node .github/scripts/check-offline-page.mjs
      - run: node .github/scripts/check-comment-length.mjs
      - run: node --test .github/scripts/check-release-line.test.mjs
      - run: node --test .github/scripts/checkout-release-tag.test.mjs
