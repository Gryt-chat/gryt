name: Store auth check

# A hand-run check that the Microsoft Store publishing credentials work, and a way
# to learn what msstore does with the sellerId.

# Reconfigure refuses to run non-interactively without one, so it gets a placeholder
# and then `msstore info` and `apps list` say whether the seller value is enforced.

# Prints the stored config — tenant, seller, client — and never the client secret.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Microsoft Store credentials
    runs-on: windows-latest
    steps:
      - name: Set up the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure with a placeholder sellerId, then probe the account
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=== reconfigure (placeholder --sellerId 0) ==="
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId 0 `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          Write-Host "reconfigure exit code: $LASTEXITCODE"

          Write-Host "=== msstore info -v (stored config; no secret) ==="
          msstore info -v

          Write-Host "=== msstore apps list -v ==="
          msstore apps list -v

          Write-Host "=== msstore apps get 9PKPT1C2M95Q -v ==="
          msstore apps get 9PKPT1C2M95Q -v
