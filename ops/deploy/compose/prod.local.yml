## Local override — merged on top of prod.yml:
##   docker compose -f prod.yml -f prod.local.yml --env-file .env.prod up -d

# Logs that survive the container. The json-file driver keeps its files under the
# container, so a routine `up -d` took seventeen hours of history on 2026-09-06.

# journald keeps them in the system journal instead, searchable across services
# by time. `docker logs` still reads back.

# In the override rather than the stack file because journald needs systemd on the
# host — Docker refuses the container without it, and self-hosters use that file.

# No max-size, because that is json-file's option and journald rejects it. Applied
# to the long-lived services only.
x-logging: &gryt-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  # The long-lived services from the stack file, here only to pick up the
  # journald driver above. Everything else about them stays as it is there.
  sfu:
    logging: *gryt-logging

  server:
    logging: *gryt-logging

  image-worker:
    logging: *gryt-logging

  client:
    logging: *gryt-logging

  # Override minio-init to also create the NT bucket
  minio-init:
    environment:
      NT_S3_BUCKET: ${NT_S3_BUCKET:-nts}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Configuring MinIO..."
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$S3_BUCKET" 2>/dev/null || true
        echo "Bucket ready: $$S3_BUCKET"
        mc mb -p "local/$$NT_S3_BUCKET" 2>/dev/null || true
        echo "Bucket ready: $$NT_S3_BUCKET"

  # ── Signaling Server (NT) ──────────────────────────────────────────────────
  server-nt:
    image: ghcr.io/gryt-chat/server:${SERVER_VERSION:-latest}
    container_name: gryt-prod-server-nt
    logging: *gryt-logging
    ports:
      - "${NT_SERVER_PORT:-5001}:5000"
    environment:
      PORT: "5000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      SERVER_NAME: ${NT_SERVER_NAME:-NT}
      # Loopback because the server has host networking and the worker publishes
      # there. Unset means no worker version is shown.
      IMAGE_WORKER_URL: http://127.0.0.1:${IMAGE_WORKER_NT_HEALTH_PORT:-8082}
      SERVER_DESCRIPTION: ${NT_SERVER_DESCRIPTION:-A Gryt voice chat server}
      SERVER_PASSWORD: ${NT_SERVER_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:15738,http://localhost:3666,https://app.gryt.chat,https://beta.gryt.chat}
      JWT_SECRET: ${NT_JWT_SECRET:?Set NT_JWT_SECRET in .env.prod}
      SFU_WS_HOST: ws://sfu:9092
      SFU_PUBLIC_HOST: ${SFU_PUBLIC_HOST:-ws://localhost:5005}
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      VOICE_MAX_USERS: ${VOICE_MAX_USERS:-}
      GRYT_SERVER_ENABLED: ${GRYT_SERVER_ENABLED:-${GRYT_AUTH_MODE:-true}}
      GRYT_OIDC_ISSUER: ${GRYT_OIDC_ISSUER:-https://auth.gryt.chat/realms/gryt}
      GRYT_OIDC_AUDIENCE: ${GRYT_OIDC_AUDIENCE:-gryt-web}
      # Which identities this server admits. Add "local" to let people
      # join without a Gryt account — see docs.gryt.chat, Server → Identity.
      GRYT_IDENTITY_TIERS: ${GRYT_IDENTITY_TIERS:-account}
      DATA_DIR: /data
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${NT_S3_BUCKET:-nts}
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - gryt-prod-server-nt-data:/data
    depends_on:
      sfu:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - gryt-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Image Worker (NT) ─────────────────────────────────────────────────────
  image-worker-nt:
    image: ghcr.io/gryt-chat/image-worker:${IMAGE_WORKER_VERSION:-latest}
    container_name: gryt-prod-image-worker-nt
    logging: *gryt-logging
    # The server has host networking, so it cannot reach this container by service
    # name. Bound to loopback: a health endpoint for the server beside it.

    # The default differs per stack on purpose. Four workers run on one Docker
    # host, and a shared default means one fails to publish or answers for another.
    ports:
      - "127.0.0.1:${IMAGE_WORKER_NT_HEALTH_PORT:-8082}:8080"
    environment:
      DATA_DIR: /data
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${NT_S3_BUCKET:-nts}
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - gryt-prod-server-nt-data:/data
    depends_on:
      server-nt:
        condition: service_healthy
    networks:
      - gryt-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  gryt-prod-server-nt-data:
