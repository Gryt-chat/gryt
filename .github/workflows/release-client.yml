name: Release Client

on:
  push:
    branches:
      - beta
      - main

  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest

      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom

      custom_version:
        description: 'Custom version, if "custom" is selected. Example: 1.2.3'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: gryt
  DOCKER_IMAGE: ghcr.io/gryt-chat/client

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      channel: ${{ steps.channel.outputs.channel }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
      release_type: ${{ steps.release_type.outputs.release_type }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Git user
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Validate release.json
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f release.json ]]; then
            echo "Missing release.json at repository root."
            exit 1
          fi

          PRODUCT="$(node -p "require('./release.json').product")"
          VERSION="$(node -p "require('./release.json').version")"

          if [[ "$PRODUCT" != "gryt" ]]; then
            echo "release.json product must be gryt"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release.json version must be stable semver like 1.1.4"
            exit 1
          fi

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            CHANNEL="latest"
          elif [[ "${{ github.ref_name }}" == "beta" ]]; then
            CHANNEL="beta"
          else
            echo "Unsupported branch: ${{ github.ref_name }}"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ steps.channel.outputs.channel }}"
          CURRENT_BASE_VERSION="$(node -p "require('./release.json').version")"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUMP="${{ github.event.inputs.bump }}"
            CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"
          else
            BUMP="patch"
            CUSTOM_VERSION=""
          fi

          bump_version() {
            local version="$1"
            local bump="$2"

            node <<'NODE' "$version" "$bump"
          const current = process.argv[2];
          const bump = process.argv[3];

          const match = current.match(/^(\d+)\.(\d+)\.(\d+)$/);
          if (!match) {
            throw new Error(`Invalid version: ${current}`);
          }

          let major = Number(match[1]);
          let minor = Number(match[2]);
          let patch = Number(match[3]);

          if (bump === "major") {
            major += 1;
            minor = 0;
            patch = 0;
          } else if (bump === "minor") {
            minor += 1;
            patch = 0;
          } else if (bump === "patch") {
            patch += 1;
          } else {
            throw new Error(`Unsupported bump: ${bump}`);
          }

          console.log(`${major}.${minor}.${patch}`);
          NODE
          }

          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "custom_version is required when bump=custom"
              exit 1
            fi

            if ! [[ "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid custom version: $CUSTOM_VERSION"
              echo "Expected stable semver like 1.2.3"
              exit 1
            fi

            BASE_VERSION="$CUSTOM_VERSION"
          else
            BASE_VERSION="$CURRENT_BASE_VERSION"

            if git rev-parse "v$BASE_VERSION" >/dev/null 2>&1; then
              BASE_VERSION="$(bump_version "$BASE_VERSION" "$BUMP")"
            fi
          fi

          if [[ "$CHANNEL" == "beta" ]]; then
            LATEST_BETA_NUMBER="$(
              git tag --list "v${BASE_VERSION}-beta.*" \
                | sed -E "s/^v${BASE_VERSION}-beta\.([0-9]+)$/\1/" \
                | sort -n \
                | tail -n 1 || true
            )"

            if [[ -z "$LATEST_BETA_NUMBER" ]]; then
              BETA_NUMBER=1
            else
              BETA_NUMBER="$((LATEST_BETA_NUMBER + 1))"
            fi

            RELEASE_VERSION="${BASE_VERSION}-beta.${BETA_NUMBER}"
          else
            RELEASE_VERSION="$BASE_VERSION"
          fi

          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists on origin."
            exit 1
          fi

          node <<'NODE' "$BASE_VERSION"
          const fs = require("fs");

          const version = process.argv[2];
          const path = "release.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));

          data.product = data.product || "gryt";
          data.version = version;

          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Base version: $BASE_VERSION"
          echo "Release version: $RELEASE_VERSION"

      - name: Create release manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          mkdir -p .release

          CLIENT_SHA="$(git -C packages/client rev-parse HEAD)"
          SERVER_SHA="$(git -C packages/server rev-parse HEAD)"
          SFU_SHA="$(git -C packages/sfu rev-parse HEAD)"

          if [[ -d packages/image-worker ]]; then
            IMAGE_WORKER_SHA="$(git -C packages/image-worker rev-parse HEAD)"
          else
            IMAGE_WORKER_SHA=""
          fi

          node <<'NODE' "$VERSION" "$BASE_VERSION" "$CHANNEL" "$CLIENT_SHA" "$SERVER_SHA" "$SFU_SHA" "$IMAGE_WORKER_SHA"
          const fs = require("fs");
          const { execSync } = require("child_process");

          const [
            version,
            baseVersion,
            channel,
            clientSha,
            serverSha,
            sfuSha,
            imageWorkerSha,
          ] = process.argv.slice(2);

          const manifest = {
            product: "gryt",
            version,
            baseVersion,
            channel,
            monorepoCommit: execSync("git rev-parse HEAD", { encoding: "utf8" }).trim(),
            createdAt: new Date().toISOString(),
            components: {
              client: {
                repo: "Gryt-chat/client",
                path: "packages/client",
                commit: clientSha,
              },
              server: {
                repo: "Gryt-chat/server",
                path: "packages/server",
                commit: serverSha,
              },
              sfu: {
                repo: "Gryt-chat/sfu",
                path: "packages/sfu",
                commit: sfuSha,
              },
              imageWorker: {
                repo: "Gryt-chat/image-worker",
                path: "packages/image-worker",
                commit: imageWorkerSha,
              },
            },
          };

          fs.writeFileSync(".release/manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          cat .release/manifest.json

      - name: Commit release metadata and tag
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          git add release.json .release/manifest.json

          if git diff --cached --quiet; then
            echo "No release metadata changes to commit."
          else
            git commit -m "release: v$VERSION ($CHANNEL) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Determine checkout ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          echo "checkout_ref=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.channel.outputs.channel }}" == "latest" ]]; then
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gryt v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          files: .release/manifest.json
          body: |
            Gryt v${{ steps.version.outputs.version }}

            Channel: ${{ steps.channel.outputs.channel }}

            This release was built from the monorepo with pinned submodule commits.

            See `manifest.json` for the exact client, server, SFU, and image-worker commits.
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-electron:
    name: Build Electron app (${{ matrix.os }})
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    env:
      OWNER: Gryt-chat
      REPO: gryt
      VERSION: ${{ needs.prepare-release.outputs.version }}
      BASE_VERSION: ${{ needs.prepare-release.outputs.base_version }}
      CHANNEL: ${{ needs.prepare-release.outputs.channel }}
      RELEASE_TYPE: ${{ needs.prepare-release.outputs.release_type }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: packages/client/yarn.lock

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libgtk-3-dev \
            libgbm-dev \
            rpm

      - name: Install client dependencies
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines

      - name: Install server dependencies
        working-directory: packages/server
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines

      - name: Install SFU dependencies
        working-directory: packages/sfu
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f go.mod ]]; then
            go mod download
          fi

      - name: Type-check client
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          npx tsc -b

      - name: Lint client
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0

      - name: Build embedded server and SFU
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          npm run build:embedded-server

      - name: Build native audio Linux
        if: runner.os == 'Linux'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          bash native/audio-capture/build.sh

      - name: Build native audio macOS
        if: runner.os == 'macOS'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          bash native/audio-capture/build.sh

      - name: Set up MSVC Build Tools Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native Windows binaries
        if: runner.os == 'Windows'
        working-directory: packages/client
        shell: cmd
        run: |
          native\build.bat

      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERT_P12_BASE64:-}" ]]; then
            echo "MACOS_CERT_P12_BASE64 is not set."
            exit 1
          fi

          if [[ -z "${MACOS_CERT_PASSWORD:-}" ]]; then
            echo "MACOS_CERT_PASSWORD is not set."
            exit 1
          fi

          if [[ -z "${KEYCHAIN_PASSWORD:-}" ]]; then
            echo "KEYCHAIN_PASSWORD is not set."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/macos-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/gryt-build.keychain-db"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MACOS_CERT_PASSWORD" >> "$GITHUB_ENV"

          if [[ -n "${APPLE_API_KEY_ID_SECRET:-}" && -n "${APPLE_API_ISSUER_SECRET:-}" && -n "${APPLE_API_KEY_P8_BASE64:-}" ]]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"

            echo "APPLE_API_KEY=$API_KEY_PATH" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ISSUER=$APPLE_API_ISSUER_SECRET" >> "$GITHUB_ENV"
          else
            echo "Apple API key secrets are incomplete. macOS signing may work, but notarization may be skipped or fail depending on Electron Builder config."
          fi

      - name: Build Electron app
        working-directory: packages/client
        shell: bash
        env:
          ELECTRON: "1"
        run: |
          set -euo pipefail
          npx vite build

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: runner.os == 'Linux'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        if: runner.os == 'Linux'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ env.VERSION }}"
          CHANNEL="${{ env.CHANNEL }}"
          IMAGE="${{ env.DOCKER_IMAGE }}"

          CLEAN_VERSION="${VERSION%%-*}"
          V_MAJOR="$(echo "$CLEAN_VERSION" | cut -d. -f1)"
          V_MINOR="$(echo "$CLEAN_VERSION" | cut -d. -f2)"

          TAGS=(
            "${IMAGE}:${VERSION}"
            "${IMAGE}:${V_MAJOR}.${V_MINOR}"
            "${IMAGE}:${V_MAJOR}"
          )

          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=("${IMAGE}:latest")
          else
            TAGS+=("${IMAGE}:latest-beta")
          fi

          ARGS=()
          for TAG in "${TAGS[@]}"; do
            ARGS+=(-t "$TAG")
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=${IMAGE}:buildcache \
            --cache-to type=registry,ref=${IMAGE}:buildcache,mode=max \
            "${ARGS[@]}" \
            --push \
            .

      - name: Install Snapcraft
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic

      - name: Package and publish Electron app
        working-directory: packages/client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
          CHANNEL: ${{ env.CHANNEL }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            TARGETS="--linux AppImage deb snap"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            TARGETS="--mac"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            TARGETS="--win"
          else
            echo "Unsupported runner OS: $RUNNER_OS"
            exit 1
          fi

          npx electron-builder \
            $TARGETS \
            --publish always \
            -c.extraMetadata.version="$VERSION" \
            -c.publish.provider=github \
            -c.publish.owner="$OWNER" \
            -c.publish.repo="$REPO" \
            -c.publish.releaseType="$RELEASE_TYPE"

      - name: Notify Discord
        if: runner.os == 'Linux'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          VERSION: ${{ env.VERSION }}
          CHANNEL: ${{ env.CHANNEL }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL secret not set, skipping"
            exit 0
          fi

          TAG="v$VERSION"
          RELEASE_URL="https://github.com/${OWNER}/${REPO}/releases/tag/$TAG"

          if [[ "$CHANNEL" == "beta" ]]; then
            DISP_CHANNEL="Beta"
            COLOR=16750848
          else
            DISP_CHANNEL="Stable"
            COLOR=5763719
          fi

          RELEASE_BODY="$(gh release view "$TAG" --repo "${OWNER}/${REPO}" --json body -q '.body' || true)"
          BODY="$(printf '%s' "$RELEASE_BODY" | head -c 1800)"

          PAYLOAD="$(jq -n \
            --arg title "Gryt $TAG" \
            --arg url "$RELEASE_URL" \
            --arg desc "$BODY" \
            --arg channel "$DISP_CHANNEL" \
            --arg component "Desktop" \
            --arg tag "$TAG" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: $color,
                fields: [
                  { name: "Component", value: $component, inline: true },
                  { name: "Channel", value: $channel, inline: true },
                  { name: "Version", value: $tag, inline: true }
                ],
                footer: { text: "Gryt Releases" },
                timestamp: (now | todate)
              }]
            }'
          )"

          curl -sfS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
