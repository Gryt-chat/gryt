name: Update Submodules

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to update"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - main

      submodules:
        description: "Submodules to update"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - client
          - server
          - sfu
          - image-worker

permissions:
  contents: write

jobs:
  update-submodules:
    name: Update submodule pointers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'beta' }}
          fetch-depth: 0
          submodules: false

      - name: Set up Git user
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Initialize top-level submodules
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync -- packages/client packages/server packages/sfu packages/image-worker
          git submodule update --init --force -- packages/client packages/server packages/sfu packages/image-worker

      - name: Update selected submodules
        shell: bash
        run: |
          set -euo pipefail

          SELECTED="${{ github.event.inputs.submodules || 'all' }}"
          TARGET_BRANCH="${{ github.event.inputs.target_branch || 'beta' }}"

          if [[ "$TARGET_BRANCH" == "main" ]]; then
            DEFAULT_SUBMODULE_BRANCH="main"
          else
            DEFAULT_SUBMODULE_BRANCH="beta"
          fi

          update_submodule() {
            local path="$1"
            local preferred_branch="$2"
            local fallback_branch="main"
            local branch=""

            if [[ ! -d "$path" ]]; then
              echo "Skipping missing submodule: $path"
              return 0
            fi

            echo "Updating $path"

            git -C "$path" fetch origin --tags

            if git -C "$path" ls-remote --exit-code --heads origin "$preferred_branch" >/dev/null 2>&1; then
              branch="$preferred_branch"
            else
              branch="$fallback_branch"
            fi

            echo "Using branch $branch for $path"

            git -C "$path" checkout -B "$branch" "origin/$branch"
            git -C "$path" pull --ff-only origin "$branch"

            git add "$path"
          }

          if [[ "$SELECTED" == "all" || "$SELECTED" == "client" ]]; then
            update_submodule "packages/client" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "server" ]]; then
            update_submodule "packages/server" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "sfu" ]]; then
            update_submodule "packages/sfu" "$DEFAULT_SUBMODULE_BRANCH"
          fi

          if [[ "$SELECTED" == "all" || "$SELECTED" == "image-worker" ]]; then
            update_submodule "packages/image-worker" "$DEFAULT_SUBMODULE_BRANCH"
          fi

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No submodule updates."
            exit 0
          fi

          TARGET_BRANCH="${{ github.event.inputs.target_branch || 'beta' }}"
          SELECTED="${{ github.event.inputs.submodules || 'all' }}"

          git commit -m "chore: update $SELECTED submodules on $TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
