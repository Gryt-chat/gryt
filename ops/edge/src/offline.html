<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Gryt is down</title>
    <style>
      /* Hallmark · macrostructure: Marquee Hero (fold only) · genre: modern-minimal
       * design-system: packages/ui/design.md · theme: @gryt/ui dark half, inlined
       * tone: utilitarian · anchor hue: gryt violet · enrichment: E-none + hard hat on the mark
       * pre-emit critique: P5 H5 E4 S5 R5 V4
       */

      /* Every value is inlined because the box that serves @gryt/ui's stylesheet is
         the one that is down. The names are design.md's aliases onto --gryt-*. */
      :root {
        color-scheme: dark;

        --color-paper: #111318;
        --color-paper-2: #1a1d24;
        --color-paper-3: #1e2028;
        --color-paper-hover: #334155;
        --color-ink: #e0e0e6;
        --color-ink-2: #888888;
        --color-rule: #2b303d;
        --color-accent: #968ff8;
        --color-accent-ink: #0c0a20;
        --color-focus: #b4afff;

        /* Chip, warning tone: --gryt-warning-3 / -6 / -11. */
        --color-warn-paper: #30250e;
        --color-warn-rule: #513c06;
        --color-warn-ink: #f8d17f;

        /* The hat, and the mark's own dark. Not on the --gryt-* scale: the hat is a
           drawing, and #2E2D5F is the mark's ground rather than a theme token. */
        --color-hi-vis: #fbbf24;
        --color-mark-ink: #2e2d5f;

        --font-sans: Inter, ui-sans-serif, system-ui, sans-serif;

        --space-3xs: 0.375rem;
        --space-2xs: 0.5rem;
        --space-xs: 0.75rem;
        --space-sm: 1rem;
        --space-md: 1.5rem;
        --space-lg: 2rem;
        --space-xl: 3rem;

        --text-sm: 0.875rem;
        --text-md: 1.0625rem;
        --text-display: clamp(2.25rem, 4vw + 0.75rem, 3.5rem);

        --radius-full: 999px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --dur-short: 180ms;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        overflow-x: clip;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        padding: var(--space-xl) var(--space-md);
        background: var(--color-paper);
        color: var(--color-ink);
        font-family: var(--font-sans);
        font-size: var(--text-md);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 34rem;
        min-width: 0;
      }

      .mark {
        width: 76px;
        height: 76px;
        display: block;
        margin-bottom: var(--space-md);
      }

      /* @gryt/ui's Chip, warning tone: pill, hairline, 12px medium. */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--space-3xs);
        padding: 0.25rem var(--space-xs);
        border: 1px solid var(--color-warn-rule);
        border-radius: var(--radius-full);
        background: var(--color-warn-paper);
        color: var(--color-warn-ink);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1.4;
      }

      .chip svg {
        width: 14px;
        height: 14px;
        flex: none;
      }

      h1 {
        margin: var(--space-sm) 0 var(--space-2xs);
        font-size: var(--text-display);
        font-weight: 600;
        letter-spacing: -0.022em;
        line-height: 1.08;
        text-wrap: balance;
        overflow-wrap: anywhere;
        min-width: 0;
      }

      .lede {
        margin: 0;
        color: var(--color-ink-2);
        text-wrap: pretty;
      }

      /* design.md: flat surfaces separated by hairlines. */
      .rule {
        height: 1px;
        margin: var(--space-lg) 0;
        border: 0;
        background: var(--color-rule);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2xs);
      }

      /* @gryt/ui's Button, medium: min-h-10 px-5 text-sm font-semibold, fully rounded. */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2xs);
        min-height: 2.5rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: var(--radius-full);
        font-size: var(--text-sm);
        font-weight: 600;
        white-space: nowrap;
        text-decoration: none;
        transition:
          scale var(--dur-short) var(--ease-out),
          background-color var(--dur-short) var(--ease-out);
      }

      .btn--accent {
        background: var(--color-accent);
        color: var(--color-accent-ink);
      }

      .btn--accent:hover {
        background: var(--color-focus);
      }

      .btn--neutral {
        background: var(--color-paper-3);
        color: var(--color-ink);
      }

      .btn--neutral:hover {
        background: var(--color-paper-hover);
      }

      /* Instant, never animated. */
      .btn:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .btn:hover {
          scale: 1.03;
        }
        .btn:active {
          scale: 0.96;
        }
      }
    </style>
  </head>
