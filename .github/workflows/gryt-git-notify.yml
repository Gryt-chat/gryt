name: Gryt Git notification

on:
  push:
  create:
  delete:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize, ready_for_review, converted_to_draft, review_requested]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  discussion:
    types: [created, answered, unanswered]
  discussion_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  discussions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: Gryt-chat/.github/actions/git-notify@main
        with:
          gryt-webhook-url: ${{ secrets.GRYT_GIT_WEBHOOK_URL }}
