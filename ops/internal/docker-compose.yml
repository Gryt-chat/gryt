services:
  docs:
    build:
      context: ../../packages/docs
      network: host
    platform: linux/amd64
    ports:
      - "${INTERNAL_DOCS_HTTP_PORT:-9471}:3000"
    restart: unless-stopped

  site:
    build:
      context: ../../packages/site
    platform: linux/amd64
    ports:
      - "${INTERNAL_SITE_HTTP_PORT:-9472}:80"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    restart: unless-stopped

  # Component library docs (ui.gryt.chat). The context is the bun workspace root
  # because apps/docs resolves @gryt/ui from source rather than from npm.
  ui:
    build:
      context: ../../packages/ui
    platform: linux/amd64
    ports:
      - "${INTERNAL_UI_HTTP_PORT:-9475}:80"
    restart: unless-stopped

  # Feature requests / user feedback (Fider)
  fider-db:
    image: postgres:17
    container_name: gryt-fider-db
    environment:
      POSTGRES_USER: "${FIDER_DB_USER:-fider}"
      POSTGRES_PASSWORD: "${FIDER_DB_PASSWORD:-changeme}"
      POSTGRES_DB: "${FIDER_DB_NAME:-fider}"
    volumes:
      - gryt-fider-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 20s
      retries: 10

  fider:
    image: getfider/fider:stable
    container_name: gryt-fider
    ports:
      - "${FIDER_HTTP_PORT:-9473}:3000"
    environment:
      # Public Host Name (must match Cloudflared hostname + scheme)
      BASE_URL: "${FIDER_BASE_URL:-https://feedback.gryt.chat}"
      # Connection string to the PostgreSQL database
      DATABASE_URL: "${FIDER_DATABASE_URL:-postgres://${FIDER_DB_USER:-fider}:${FIDER_DB_PASSWORD:-changeme}@fider-db:5432/${FIDER_DB_NAME:-fider}?sslmode=disable}"
      # Generate a secure secret, for example using https://jwtsecrets.com
      JWT_SECRET: "${FIDER_JWT_SECRET:-}"
      # From which account e-mails will be sent
      EMAIL_NOREPLY: "${FIDER_EMAIL_NOREPLY:-${GRYT_SMTP_FROM:-hello@gryt.chat}}"
      # SMTP (required)
      EMAIL_SMTP_HOST: "${FIDER_EMAIL_SMTP_HOST:-${GRYT_SMTP_HOST:-}}"
      EMAIL_SMTP_PORT: "${FIDER_EMAIL_SMTP_PORT:-${GRYT_SMTP_PORT:-587}}"
      EMAIL_SMTP_USERNAME: "${FIDER_EMAIL_SMTP_USERNAME:-${GRYT_SMTP_USER:-}}"
      EMAIL_SMTP_PASSWORD: "${FIDER_EMAIL_SMTP_PASSWORD:-${GRYT_SMTP_PASS:-}}"
      EMAIL_SMTP_ENABLE_STARTTLS: "${FIDER_EMAIL_SMTP_ENABLE_STARTTLS:-true}"
    depends_on:
      fider-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/fider", "ping"]
      interval: 2s
      timeout: 10s
      retries: 10

  # Bug reports and feedback sent from inside the apps (reports.gryt.chat). Fider
  # above is the public half; this is the one nobody else reads.
  reports:
    image: ghcr.io/gryt-chat/reports:${REPORTS_IMAGE_TAG:-latest}
    container_name: gryt-reports
    ports:
      # One port. Reports come in here and the inbox is /admin on the same
      # hostname, behind Keycloak sign-in.
      - "${INTERNAL_REPORTS_HTTP_PORT:-9476}:8080"
    environment:
      # One key per app, and empty here (GRYT-529): a key shipped inside a public
      # app is not a secret, and rotating it cuts off everybody who has not updated.

      # Not additive with ALLOW_UNKEYED below — with keys set, an app id that is
      # not among them is refused whatever that says.
      REPORTS_APP_KEYS: "${REPORTS_APP_KEYS:-}"
      REPORTS_ALLOW_UNKEYED: "${REPORTS_ALLOW_UNKEYED:-false}"
      # The shortest gap between one client's reports. A script posting in a loop
      # is stopped by its second request, before any hourly counter has noticed.
      REPORTS_MIN_INTERVAL_SEC: "${REPORTS_MIN_INTERVAL_SEC:-10}"
      # Only the noise verdict counts. not_a_bug is a feature request or a support
      # question, and banning that person is the opposite of what this is for.
      REPORTS_AUTO_BAN_NOISE: "${REPORTS_AUTO_BAN_NOISE:-3}"
      REPORTS_AUTO_BAN_WINDOW_H: "${REPORTS_AUTO_BAN_WINDOW_H:-24}"
      REPORTS_AUTO_BAN_DAYS: "${REPORTS_AUTO_BAN_DAYS:-7}"
      REPORTS_ADMIN_TOKEN: "${REPORTS_ADMIN_TOKEN:-}"
      REPORTS_PUBLIC_URL: "${REPORTS_PUBLIC_URL:-https://reports.gryt.chat}"
      REPORTS_CORS_ORIGINS: "${REPORTS_CORS_ORIGINS:-https://app.gryt.chat,https://beta.gryt.chat}"
      REPORTS_REQUIRE_SIGNATURE: "${REPORTS_REQUIRE_SIGNATURE:-false}"
      # Behind the tunnel the socket address is the proxy, so the client address
      # comes from cf-connecting-ip — and only when the proxy is connecting.

      # The ingest port is on the machine's network address, so without this list
      # anything on the LAN can claim any address and skip every per-address limit.
      REPORTS_TRUST_PROXY: "true"
      REPORTS_TRUSTED_PROXIES: "${REPORTS_TRUSTED_PROXIES:-}"
      # Triage. A URL picks the local model, a key picks the API, and naming the
      # provider wins over both. Ollama runs on another machine.
      REPORTS_TRIAGE_PROVIDER: "${REPORTS_TRIAGE_PROVIDER:-}"
      REPORTS_OLLAMA_URL: "${REPORTS_OLLAMA_URL:-}"
      REPORTS_OLLAMA_KEEP_ALIVE: "${REPORTS_OLLAMA_KEEP_ALIVE:-5m}"
      REPORTS_TRIAGE_TIMEOUT_MS: "${REPORTS_TRIAGE_TIMEOUT_MS:-120000}"
      # Whether the model may reason before it answers. Worth the extra seconds:
      # it is the difference between "the app crashed" and "TypeError in ChannelList".
      REPORTS_TRIAGE_THINK: "${REPORTS_TRIAGE_THINK:-}"
      # Empty follows REPORTS_TRIAGE_THINK.
      REPORTS_DRAFT_THINK: "${REPORTS_DRAFT_THINK:-}"
      # Ollama's own default is 4096, which a long report and its thinking overflow.
      REPORTS_OLLAMA_NUM_CTX: "${REPORTS_OLLAMA_NUM_CTX:-16384}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      REPORTS_TRIAGE_MODEL: "${REPORTS_TRIAGE_MODEL:-}"
      REPORTS_DISCORD_WEBHOOK_URL: "${REPORTS_DISCORD_WEBHOOK_URL:-}"
      REPORTS_GRYT_WEBHOOK_URL: "${REPORTS_GRYT_WEBHOOK_URL:-}"
      # Filing a report as a task on the board (GRYT-534). A write credential, so
      # empty here; without it the button is not offered rather than broken.

      # The address has no default either — a built-in one files onto whoever's
      # board was compiled in.
      REPORTS_VIKUNJA_URL: "${REPORTS_VIKUNJA_URL:-}"
      REPORTS_VIKUNJA_TOKEN: "${REPORTS_VIKUNJA_TOKEN:-}"
      REPORTS_VIKUNJA_PROJECT: "${REPORTS_VIKUNJA_PROJECT:-2}"
      # The weekly digest (GRYT-537). SMTP is the GRYT_SMTP_* set the rest of Gryt
      # already points at Postmark, rather than a second copy to rotate.

      # Which is why it has to be named here: a variable in .env and not in this
      # block reaches nothing, silently.
      REPORTS_DIGEST_ENABLED: "${REPORTS_DIGEST_ENABLED:-}"
      REPORTS_DIGEST_DAY: "${REPORTS_DIGEST_DAY:-1}"
      REPORTS_DIGEST_HOUR: "${REPORTS_DIGEST_HOUR:-9}"
      GRYT_SMTP_HOST: "${GRYT_SMTP_HOST:-}"
      GRYT_SMTP_PORT: "${GRYT_SMTP_PORT:-587}"
      GRYT_SMTP_USER: "${GRYT_SMTP_USER:-}"
      GRYT_SMTP_PASS: "${GRYT_SMTP_PASS:-}"
      GRYT_SMTP_FROM: "${GRYT_SMTP_FROM:-hello@gryt.chat}"
      GRYT_SMTP_FROM_NAME: "${GRYT_SMTP_FROM_NAME:-Gryt}"
      GRYT_SMTP_REPLY_TO: "${GRYT_SMTP_REPLY_TO:-}"
      REPORTS_NOTIFY_ON: "${REPORTS_NOTIFY_ON:-triage}"
      # Signing in with a Gryt account. Who may actually read the inbox is a
      # list inside the service, not a role in the realm.
      REPORTS_OIDC_ISSUER: "${REPORTS_OIDC_ISSUER:-}"
      REPORTS_OIDC_CLIENT_ID: "${REPORTS_OIDC_CLIENT_ID:-}"
      REPORTS_OIDC_CLIENT_SECRET: "${REPORTS_OIDC_CLIENT_SECRET:-}"
      REPORTS_OIDC_REDIRECT_URI: "${REPORTS_OIDC_REDIRECT_URI:-}"
      REPORTS_BOOTSTRAP_ADMIN: "${REPORTS_BOOTSTRAP_ADMIN:-}"
      REPORTS_SESSION_SECRET: "${REPORTS_SESSION_SECRET:-}"
    volumes:
      - gryt-reports-data:/data
    restart: unless-stopped

  # The push relay (push.gryt.chat, GRYT-1656). Gryt servers post a capability and
  # a kind here, and it forwards a fixed notification to Apple or Google.
  push:
    image: ghcr.io/gryt-chat/push:${PUSH_IMAGE_TAG:-latest}
    container_name: gryt-push
    ports:
      - "${INTERNAL_PUSH_HTTP_PORT:-9477}:8080"
    environment:
      PUSH_VERSION: "${PUSH_IMAGE_TAG:-latest}"
      # Daily counts for push-prometheus below (GRYT-1695). Reached on this compose network, never published.
      METRICS_PORT: "9091"
      # Behind the tunnel, like reports. Without the list anything on the LAN could
      # claim any address and dodge the per-address limits.
      TRUST_PROXY: "true"
      TRUSTED_PROXIES: "${PUSH_TRUSTED_PROXIES:-}"
      # The keys are files, mounted read-only and owned by the container's user (1001).
      APNS_KEY_PATH: /keys/apns.p8
      APNS_KEY_ID: "${PUSH_APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${PUSH_APNS_TEAM_ID:-8883W2XTQ8}"
      APNS_TOPIC: "${PUSH_APNS_TOPIC:-chat.gryt.app}"
      FCM_SERVICE_ACCOUNT_PATH: /keys/fcm.json
    volumes:
      - gryt-push-data:/data
      - ${PUSH_KEYS_DIR:-./push-keys}:/keys:ro
    restart: unless-stopped

  # How many pushes go out, for graphs over months. Only the relay's counts: nothing
  # per device or per server exists to scrape. Both bound to localhost; reach them over SSH.
  push-prometheus:
    image: prom/prometheus:v3.5.0
    container_name: gryt-push-prometheus
    ports:
      - "127.0.0.1:${INTERNAL_PUSH_PROMETHEUS_PORT:-9479}:9090"
    volumes:
      - gryt-push-prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/prometheus.yml <<'CFG'
        global:
          scrape_interval: 60s
        scrape_configs:
          - job_name: gryt-push
            static_configs:
              - targets: ["push:9091"]
        CFG
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.retention.time=10y
    depends_on:
      - push
    restart: unless-stopped

  push-grafana:
    image: grafana/grafana:11.6.0
    container_name: gryt-push-grafana
    ports:
      - "127.0.0.1:${INTERNAL_PUSH_GRAFANA_PORT:-9480}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${PUSH_GRAFANA_ADMIN_USER:-admin}"
      # Not `:?`: a missing variable would fail every compose command here, the site refresh included.
      GF_SECURITY_ADMIN_PASSWORD: "${PUSH_GRAFANA_ADMIN_PASSWORD:-}"
      # Localhost only, so viewing needs no login; changing a dashboard does.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/push.json
    volumes:
      - ./push-grafana:/etc/grafana/provisioning:ro
      - gryt-push-grafana-data:/var/lib/grafana
    depends_on:
      - push-prometheus
    restart: unless-stopped

volumes:
  gryt-fider-pg-data:
  # Every report anyone has ever sent. There are no off-box backups of this.
  gryt-reports-data:
  gryt-push-data:
  # Years of push counts. Small: a handful of series, scraped once a minute.
  gryt-push-prometheus-data:
  gryt-push-grafana-data:
