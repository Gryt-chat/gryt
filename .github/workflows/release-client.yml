name: Release Client

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest

      bump:
        description: "Client/product version change"
        required: true
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
          - custom

      custom_version:
        description: 'Custom stable version, if "custom" is selected. Example: 1.2.3'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write
  # For the `gh workflow run` at the end of publish-release, which starts
  # publish-snap.yml. Dispatching a workflow is an Actions write.
  actions: write
  # Both for `actions/attest-build-provenance` (GRYT-723): `id-token` proves to sigstore which
  # workflow this is, and `attestations` lets it store the result against this repository.
  id-token: write
  attestations: write

concurrency:
  # Shared with release-server.yml on purpose: both commit to the same branch, so a
  # per-workflow group let a client release and a server release race for the push.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: gryt
  DOCKER_IMAGE: ghcr.io/gryt-chat/client

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      channel: ${{ steps.channel.outputs.channel }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
      release_type: ${{ steps.release_type.outputs.release_type }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout required submodules
        shell: bash
        run: |
          set -euo pipefail

          # Clone from the URL rather than the recorded gitlink: a pointer at a commit not on
          # the remote kills the job. This list and "Move release submodules" must match.
          for path in packages/client packages/server packages/sfu packages/image-worker; do
            if [[ -e "$path/.git" ]]; then
              continue
            fi
            name=$(git config -f .gitmodules --get-regexp '\.path$' \
              | awk -v p="$path" '$2 == p { print $1 }' \
              | sed 's/^submodule\.//; s/\.path$//')
            url=$(git config -f .gitmodules --get "submodule.${name}.url")
            if [[ -z "$url" ]]; then
              echo "No URL in .gitmodules for $path — skipping."
              continue
            fi
            echo "Cloning $path from $url"
            rm -rf "$path"
            git clone --quiet "$url" "$path"
          done

          git submodule sync -- packages/client packages/server packages/sfu packages/image-worker

      - name: Configure client repository authentication
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_PAT:-}" ]]; then
            echo "RELEASE_PAT is required to push the client package.json version bump."
            exit 1
          fi

          git -C packages/client remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/Gryt-chat/client.git"

      - name: Verify push access before anything is published
        uses: ./.github/actions/verify-push-access
        with:
          repository: Gryt-chat/client
          token: ${{ secrets.RELEASE_PAT }}
          monorepo: ${{ github.repository }}
          monorepo-token: ${{ github.token }}

      - name: Move release submodules into place
        shell: bash
        run: |
          set -euo pipefail

          # The client is released from its main, not the superproject's gitlink, which only
          # moves when update-submodules.yml runs and could ship a disagreeing client.
          git -C packages/client fetch origin main
          git -C packages/client checkout -B main origin/main
          echo "packages/client -> $(git -C packages/client rev-parse --short HEAD) (main)"

          # The three embedded services come from their newest release tag, not main: an
          # untagged build reports `git describe` and versionCheck compared it as 1.0.0.

          # Which tag depends on the channel (GRYT-724): stable-only shipped a beta client
          # with a server that did not publish the permission it asks about.
          if [[ "${{ github.event.inputs.channel }}" == "beta" ]]; then
            # Plain releases too, so a stable newer than the last beta wins.
            tag_pattern='v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?'
          else
            tag_pattern='v[0-9]+\.[0-9]+\.[0-9]+'
          fi

          for path in packages/server packages/sfu packages/image-worker; do
            git -C "$path" fetch origin main --tags --force

            # versionsort.suffix is what makes -v:refname semver precedence rather than
            # string order: without it v1.6.15-beta.1 sorts above v1.6.15.
            tag=$(git -C "$path" \
                -c versionsort.suffix=-alpha \
                -c versionsort.suffix=-beta \
                -c versionsort.suffix=-rc \
                tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
              | grep -Ex "$tag_pattern" \
              | head -1 || true)

            # `|| true` above because grep exits 1 on no match and pipefail is
            # on, which killed the step before this guard could say why.
            if [[ -z "$tag" ]]; then
              echo "::error::No release tag in $path for the ${{ github.event.inputs.channel }} channel. Release it before releasing the client."
              exit 1
            fi

            # Detached on purpose: this is a point in history, not a branch to
            # carry on from.
            git -C "$path" checkout --detach --quiet "$tag"
            echo "$path -> $(git -C "$path" rev-parse --short HEAD) ($tag)"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Git user
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          # The channel is picked at dispatch rather than read off the branch. Deriving it
          # from github.ref_name implied a beta branch built beta code, which was never true.
          CHANNEL="${{ github.event.inputs.channel }}"

          if [[ "$CHANNEL" != "latest" && "$CHANNEL" != "beta" ]]; then
            echo "Unsupported channel: $CHANNEL"
            exit 1
          fi

          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "Client releases run from main."
            echo "Current branch: ${{ github.ref_name }}"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL"

      - name: Validate release.json
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f release.json ]]; then
            echo "Missing release.json at repository root."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("release.json", "utf8"));

            if (data.product !== "gryt") {
              throw new Error("release.json product must be gryt");
            }

            if (!/^\d+\.\d+\.\d+$/.test(data.version)) {
              throw new Error("release.json version must be stable semver like 1.2.3");
            }

            if (data.server && !/^\d+\.\d+\.\d+$/.test(data.server)) {
              throw new Error("release.json server must be stable semver like 1.2.3");
            }
          '

      - name: Fetch release tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ steps.channel.outputs.channel }}"
          CURRENT_BASE_VERSION="$(node -p "require('./release.json').version")"
          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          bump_version() {
            local version="$1"
            local bump="$2"

            node -e '
              const current = process.argv[1];
              const bump = process.argv[2];

              const match = current.match(/^(\d+)\.(\d+)\.(\d+)$/);
              if (!match) {
                throw new Error(`Invalid version: ${current}`);
              }

              let major = Number(match[1]);
              let minor = Number(match[2]);
              let patch = Number(match[3]);

              if (bump === "major") {
                major += 1;
                minor = 0;
                patch = 0;
              } else if (bump === "minor") {
                minor += 1;
                patch = 0;
              } else if (bump === "patch") {
                patch += 1;
              } else {
                throw new Error(`Unsupported bump: ${bump}`);
              }

              console.log(`${major}.${minor}.${patch}`);
            ' "$version" "$bump"
          }

          case "$BUMP" in
            none)
              BASE_VERSION="$CURRENT_BASE_VERSION"
              ;;
            patch|minor|major)
              BASE_VERSION="$(bump_version "$CURRENT_BASE_VERSION" "$BUMP")"
              ;;
            custom)
              if [[ -z "$CUSTOM_VERSION" ]]; then
                echo "custom_version is required when bump=custom"
                exit 1
              fi

              if ! [[ "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Invalid custom version: $CUSTOM_VERSION"
                echo "Expected stable semver like 1.2.3"
                exit 1
              fi

              BASE_VERSION="$CUSTOM_VERSION"
              ;;
            *)
              echo "Unsupported bump: $BUMP"
              exit 1
              ;;
          esac

          # Refuse to publish behind what has already shipped: merging the two release lines
          # computed 1.3.0-beta.2 while v1.3.1-beta.1 existed. Base versions only.
          HIGHEST_BASE="$(git tag --list 'v*' | sed 's/^v//; s/-.*$//' | sort -V | tail -n 1 || true)"

          if [[ -n "$HIGHEST_BASE" && "$BASE_VERSION" != "$HIGHEST_BASE" ]]; then
            OLDEST="$(printf '%s\n%s\n' "$HIGHEST_BASE" "$BASE_VERSION" | sort -V | head -n 1)"

            if [[ "$OLDEST" == "$BASE_VERSION" ]]; then
              echo "release.json is behind the tags."
              echo "  release.json base version: $BASE_VERSION"
              echo "  highest released base:     $HIGHEST_BASE"
              echo "Bump release.json to at least $HIGHEST_BASE before releasing."
              exit 1
            fi
          fi

          if [[ "$CHANNEL" == "beta" ]]; then
            LATEST_BETA_NUMBER="$(
              git tag --list "v${BASE_VERSION}-beta.*" \
                | sed -E "s/^v${BASE_VERSION}-beta\.([0-9]+)$/\1/" \
                | sort -n \
                | tail -n 1 || true
            )"

            if [[ -z "$LATEST_BETA_NUMBER" ]]; then
              BETA_NUMBER=1
            else
              BETA_NUMBER="$((LATEST_BETA_NUMBER + 1))"
            fi

            RELEASE_VERSION="${BASE_VERSION}-beta.${BETA_NUMBER}"
          else
            RELEASE_VERSION="$BASE_VERSION"
          fi

          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists on origin."
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Current base version: $CURRENT_BASE_VERSION"
          echo "New base version: $BASE_VERSION"
          echo "Release version: $RELEASE_VERSION"

      # The version is known and nothing is committed yet. Without a line the
      # app says nothing changed and gryt.chat stops deploying (GRYT-1107).
      - name: Require a changelog line
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/check-release-line.mjs app "${{ steps.version.outputs.version }}"

      - name: Update monorepo release.json
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="${{ steps.version.outputs.base_version }}"

          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const path = "release.json";
            const data = JSON.parse(fs.readFileSync(path, "utf8"));

            data.product = data.product || "gryt";
            data.version = version;

            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          ' "$BASE_VERSION"

      - name: Update client package version
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION="${{ steps.version.outputs.version }}"

          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const path = "packages/client/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));

            pkg.version = version;

            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          ' "$RELEASE_VERSION"

          echo "Client package.json version set to $RELEASE_VERSION"
          node -p "require('./packages/client/package.json').version"

      - name: Commit client version bump
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION="${{ steps.version.outputs.version }}"

          git -C packages/client add package.json

          if git -C packages/client diff --cached --quiet; then
            echo "No client package.json changes to commit."
          else
            git -C packages/client commit -m "release: v${RELEASE_VERSION}"
            git -C packages/client push origin "HEAD:main"
          fi

      - name: Create release manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          mkdir -p .release

          CLIENT_SHA="$(git -C packages/client rev-parse HEAD)"
          SERVER_SHA="$(git -C packages/server rev-parse HEAD)"
          SFU_SHA="$(git -C packages/sfu rev-parse HEAD)"
          IMAGE_WORKER_SHA="$(git -C packages/image-worker rev-parse HEAD)"

          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            const [
              version,
              baseVersion,
              channel,
              clientSha,
              serverSha,
              sfuSha,
              imageWorkerSha,
            ] = process.argv.slice(1);

            const manifest = {
              product: "gryt",
              version,
              baseVersion,
              channel,
              monorepoCommit: execSync("git rev-parse HEAD", { encoding: "utf8" }).trim(),
              createdAt: new Date().toISOString(),
              components: {
                client: {
                  repo: "Gryt-chat/client",
                  path: "packages/client",
                  commit: clientSha
                },
                server: {
                  repo: "Gryt-chat/server",
                  path: "packages/server",
                  commit: serverSha
                },
                sfu: {
                  repo: "Gryt-chat/sfu",
                  path: "packages/sfu",
                  commit: sfuSha
                },
                imageWorker: {
                  repo: "Gryt-chat/image-worker",
                  path: "packages/image-worker",
                  commit: imageWorkerSha
                }
              }
            };

            fs.writeFileSync(".release/manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          ' "$VERSION" "$BASE_VERSION" "$CHANNEL" "$CLIENT_SHA" "$SERVER_SHA" "$SFU_SHA" "$IMAGE_WORKER_SHA"

          cat .release/manifest.json

      # `generate_release_notes: true` is useless here: the superproject's commits between
      # releases are submodule bumps. Runs before the tag, so the newest tag is the previous.
      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PREVIOUS_MANIFEST="${RUNNER_TEMP}/previous-manifest.json"

          # The previous stable release, whichever channel this is, so a beta lists everything
          # since the last thing most people are running.
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vx "v${VERSION}" \
            | head -n1 || true)"

          ARGS=(--current .release/manifest.json --repo-root .)
          if [[ -n "$PREVIOUS_TAG" ]] \
            && git show "${PREVIOUS_TAG}:.release/manifest.json" > "$PREVIOUS_MANIFEST" 2>/dev/null; then
            echo "Comparing against $PREVIOUS_TAG"
            ARGS+=(--previous "$PREVIOUS_MANIFEST")
          else
            # Only reachable for a release line older than the manifest. Worth degrading
            # rather than failing: a release with no list of changes still installs.
            echo "No previous manifest found — the notes will say so."
            rm -f "$PREVIOUS_MANIFEST"
          fi

          node .github/scripts/release-notes.mjs "${ARGS[@]}" > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Commit release metadata and tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # This branch can move between checkout and here, and a replay conflicts because the
          # server writes "server" where we write "version". Re-apply what we own and retry.
          MANIFEST_BACKUP="${RUNNER_TEMP}/release-manifest.json"
          cp .release/manifest.json "$MANIFEST_BACKUP"

          apply_release_metadata() {
            mkdir -p .release
            cp "$MANIFEST_BACKUP" .release/manifest.json

            node -e '
              const fs = require("fs");
              const version = process.argv[1];
              const path = "release.json";
              const data = JSON.parse(fs.readFileSync(path, "utf8"));

              data.product = data.product || "gryt";
              data.version = version;

              fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
            ' "$BASE_VERSION"
          }

          outcome=""
          for attempt in 1 2 3 4 5; do
            apply_release_metadata
          # Every submodule moved above, so the tag records what was built: a path left out is
          # built from whatever main pointed at while manifest.json names another commit.
            git add release.json .release/manifest.json \
              packages/client packages/server packages/sfu packages/image-worker

            if git diff --cached --quiet; then
              echo "No release metadata changes to commit."
              outcome="nothing-to-commit"
              break
            fi

            git commit -m "release: v$VERSION ($CHANNEL) [skip ci]"

            if git push origin "HEAD:${BRANCH}"; then
              outcome="pushed"
              break
            fi

            echo "Push rejected (attempt ${attempt}/5) — reapplying onto the current ${BRANCH}."
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            sleep $(( attempt * 5 ))
          done

          if [[ -z "$outcome" ]]; then
            echo "Could not push the release commit after 5 attempts." >&2
            exit 1
          fi

          # Tagged after the push succeeds, so a tag can never name a commit not on the
          # branch. Accept a tag already naming this commit; refuse to move one (GRYT-300).
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin "refs/tags/v${VERSION}" | awk '{ print $1 }')"

          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$HEAD_SHA" ]]; then
            echo "v${VERSION} already exists on the remote at ${REMOTE_SHA}," >&2
            echo "but this release built ${HEAD_SHA}." >&2
            echo "" >&2
            echo "Refusing to move a published tag. Either delete the remote tag" >&2
            echo "and dispatch again, or release a new version." >&2
            exit 1
          fi

          if [[ -n "$REMOTE_SHA" ]]; then
            echo "v${VERSION} is already on the remote at ${HEAD_SHA}."
          else
            git tag -f "v$VERSION" "$HEAD_SHA"
            git push origin "v$VERSION"
          fi

      - name: Determine checkout ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          echo "checkout_ref=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.channel.outputs.channel }}" == "latest" ]]; then
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          fi

      # Created as a draft so nothing sees it until every platform has uploaded: the builds
      # finish minutes apart, and a client checking in that gap 404s on its channel file.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gryt v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          draft: true
          files: .release/manifest.json
          body_path: ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-electron:
    name: Build Electron app (${{ matrix.os }}, ${{ matrix.variant }})
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        # Two builds per platform. `slim` leaves the embedded server out, 34MB off the
        # installer, and is what the site offers as the default download.
        variant:
          - full
          - slim
        os:
          - ubuntu-latest
          - macos-latest
          # Pinned; do not move back to windows-latest without re-running the probe. node-gyp
          # is out of this path now, but native/build.bat has never been tried against VS 18.
          - windows-2022

    runs-on: ${{ matrix.os }}

    # publish-release needs this job, and a matrix leg failing fails the job. Slim is
    # additive; worth removing once a release has proven it, so a missing artifact fails.
    continue-on-error: ${{ matrix.variant == 'slim' }}

    env:
      OWNER: Gryt-chat
      # Read by the client's beforeBuild hook, its extraResources check and
      # electron-builder.config.cjs. Empty is what `full` means to all three.
      GRYT_VARIANT: ${{ matrix.variant == 'slim' && 'slim' || '' }}
      REPO: gryt
      VERSION: ${{ needs.prepare-release.outputs.version }}
      BASE_VERSION: ${{ needs.prepare-release.outputs.base_version }}
      CHANNEL: ${{ needs.prepare-release.outputs.channel }}
      RELEASE_TYPE: ${{ needs.prepare-release.outputs.release_type }}
      # 'true' only once the Store submission secrets exist. The Store steps gate on it, so
      # they stay dormant and a release stays green until Partner Center is wired up.
      HAS_STORE_CREDS: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID != '' }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false

      - name: Checkout required submodules
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync -- packages/client packages/server packages/sfu packages/image-worker
          git submodule update --init --force -- packages/client packages/server packages/sfu packages/image-worker

      - name: Verify packaged client version
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="${{ env.VERSION }}"
          ACTUAL="$(node -p "require('./packages/client/package.json').version")"

          echo "Expected client package version: $EXPECTED"
          echo "Actual client package version:   $ACTUAL"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Client package.json version mismatch."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: packages/client/yarn.lock

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: packages/sfu/go.sum

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libgtk-3-dev \
            libgbm-dev \
            rpm

      - name: Install client dependencies
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines

      - name: Generate app icons
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.['icons:generate'] ? 0 : 1)"; then
            yarn icons:generate
          else
            echo "No icons:generate script found, skipping."
          fi

      - name: Install server dependencies
        if: matrix.variant == 'full'
        working-directory: packages/server
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines

      - name: Install SFU dependencies
        if: matrix.variant == 'full'
        working-directory: packages/sfu
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f go.mod ]]; then
            go mod download
          fi

      # build-embedded-server.mjs runs `npm run build` here and the worker's script is a bare
      # `tsc`, so without this the compiler is not on disk on a fresh checkout.
      - name: Install image worker dependencies
        if: matrix.variant == 'full'
        working-directory: packages/image-worker
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines

      - name: Type-check client
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          npx tsc -b

      - name: Lint client
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0

      # Still required, but for "Build native Windows binaries" below rather than node-gyp:
      # native/build.bat compiles the audio and screen helpers. Delete it and that breaks.
      - name: Set up MSVC Build Tools Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build embedded server and SFU
        if: matrix.variant == 'full'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          npm run build:embedded-server

      - name: Verify embedded server dependencies
        if: matrix.variant == 'full'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f build/embedded-server/server/bundle.js ]]; then
            echo "Missing embedded server bundle.js"
            exit 1
          fi

          if [[ ! -d build/embedded-server/server/node_modules ]]; then
            echo "Missing embedded server node_modules directory."
            exit 1
          fi

          # sharp is what this checks now: it ships as a per-platform optional dependency, so
          # a bundle built on the wrong host throws the first time anyone uploads an image.
          if [[ ! -d build/embedded-server/server/node_modules/sharp ]]; then
            echo "Missing embedded sharp dependency."
            echo "The packaged app will crash with: Cannot find module 'sharp'"
            exit 1
          fi

          if [[ ! -d build/embedded-server/worker/node_modules/sharp ]]; then
            echo "Missing sharp in the image worker bundle."
            echo "Image jobs would queue and never be processed."
            exit 1
          fi

          echo "Embedded server dependencies are present."

      - name: Build native audio Linux
        if: runner.os == 'Linux'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          bash native/audio-capture/build.sh

      - name: Build native audio macOS
        if: runner.os == 'macOS'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail
          bash native/audio-capture/build.sh

      - name: Build native Windows binaries
        if: runner.os == 'Windows'
        working-directory: packages/client
        shell: cmd
        run: |
          native\build.bat

      - name: Prepare macOS signing keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.MACOS_CERT_P12_BASE64 }}" ]]; then
            echo "MACOS_CERT_P12_BASE64 is not set."
            exit 1
          fi

          if [[ -z "${{ secrets.MACOS_CERT_PASSWORD }}" ]]; then
            echo "MACOS_CERT_PASSWORD is not set."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          echo "${{ secrets.MACOS_CERT_P12_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.MACOS_CERT_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity -v -p codesigning || true

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build Electron app
        working-directory: packages/client
        shell: bash
        env:
          ELECTRON: "1"
        run: |
          set -euo pipefail
          npx vite build

      - name: Set up Docker Buildx
        if: runner.os == 'Linux' && matrix.variant == 'full'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: runner.os == 'Linux' && matrix.variant == 'full'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        id: docker
        if: runner.os == 'Linux' && matrix.variant == 'full'
        working-directory: packages/client
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ env.VERSION }}"
          CHANNEL="${{ env.CHANNEL }}"
          IMAGE="${{ env.DOCKER_IMAGE }}"

          CLEAN_VERSION="${VERSION%%-*}"
          V_MAJOR="$(echo "$CLEAN_VERSION" | cut -d. -f1)"
          V_MINOR="$(echo "$CLEAN_VERSION" | cut -d. -f2)"

          TAGS=(
            "${IMAGE}:${VERSION}"
            "${IMAGE}:${V_MAJOR}.${V_MINOR}"
            "${IMAGE}:${V_MAJOR}"
          )

          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=("${IMAGE}:latest")
          else
            TAGS+=("${IMAGE}:latest-beta")
          fi

          ARGS=()
          for TAG in "${TAGS[@]}"; do
            ARGS+=(-t "$TAG")
          done

          # A push refused by GHCR is usually the secondary rate limit; v1.5.0-beta.1 was half
          # published. Retried, because giving up leaves the release a draft nobody installs.

          # The digest is written out so the image can be attested by it (GRYT-760).
          METADATA="${RUNNER_TEMP}/buildx-metadata.json"

          pushed=""
          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from type=registry,ref=${IMAGE}:buildcache \
              --cache-to type=registry,ref=${IMAGE}:buildcache,mode=max \
              "${ARGS[@]}" \
              --metadata-file "$METADATA" \
              --push \
              .
            then
              pushed="yes"
              break
            fi

            echo "Docker build/push failed (attempt ${attempt}/5) — retrying."
            sleep $(( attempt * 20 ))
          done

          if [[ -z "$pushed" ]]; then
            echo "Could not build and push the image after 5 attempts." >&2
            exit 1
          fi

          DIGEST="$(jq -r '."containerimage.digest" // empty' "$METADATA")"
          if [[ -z "$DIGEST" ]]; then
            echo "::error::buildx wrote no containerimage.digest — nothing to attest."
            exit 1
          fi

          echo "Image digest: $DIGEST"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest the client image
        if: runner.os == 'Linux' && matrix.variant == 'full'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.DOCKER_IMAGE }}
          subject-digest: ${{ steps.docker.outputs.image_digest }}
          # Stored alongside the image in GHCR as well as in the log, so `gh attestation
          # verify oci://...` works without knowing which repository built it.
          push-to-registry: true

      - name: Package and publish Electron app
        if: runner.os != 'macOS'
        working-directory: packages/client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
          CHANNEL: ${{ env.CHANNEL }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
          VERSION: ${{ env.VERSION }}
          # Windows signing, empty until a certificate exists: sign-windows.cjs signs nothing
          # and warns that Smart App Control will block the result. See GRYT-848.
          GRYT_WIN_SIGN_TOOL: ${{ secrets.WINDOWS_SIGN_TOOL }}
          GRYT_WIN_SIGN_ARGS: ${{ secrets.WINDOWS_SIGN_ARGS }}
        run: |
          set -euo pipefail

          # The -c.snap.publish.* overrides keep the snap out of the store from here, spelled
          # out per key: the shorthand replaces the config and left v1.5.9 a draft.

          # `--win nsis portable` rather than a bare `--win`, which also builds and publishes
          # the appx — an unsigned MSIX nobody can install. See GRYT-848.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            TARGETS="--linux AppImage deb rpm snap"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            TARGETS="--win nsis portable"
          else
            echo "Unsupported runner OS: $RUNNER_OS"
            exit 1
          fi

          # electron-builder fetches Electron through DownloadNoRetry, so a dropped connection
          # fails the build outright. Three attempts: a real failure repeats the whole build.
          published=""
          for attempt in 1 2 3; do
            if npx electron-builder \
              --config electron-builder.config.cjs \
              $TARGETS \
              --publish always \
              -c.extraMetadata.version="$VERSION" \
              -c.publish.provider=github \
              -c.publish.owner="$OWNER" \
              -c.publish.repo="$REPO" \
              -c.publish.releaseType="$RELEASE_TYPE" \
              -c.snap.publish.provider=github \
              -c.snap.publish.owner="$OWNER" \
              -c.snap.publish.repo="$REPO" \
              -c.snap.publish.releaseType="$RELEASE_TYPE"
            then
              published="yes"
              break
            fi

            echo "electron-builder failed (attempt ${attempt}/3) — retrying."
            sleep $(( attempt * 20 ))
          done

          if [[ -z "$published" ]]; then
            echo "Could not package and publish after 3 attempts." >&2
            exit 1
          fi

      - name: Relink Linux AppImages onto a FUSE-free runtime
        if: runner.os == 'Linux'
        working-directory: packages/client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail

          # electron-builder 26.x builds AppImages against libfuse2, which fuse3-only distros
          # no longer ship (GRYT-953). Pinned by sha256, so a moved runtime fails the checksum.
          RUNTIME_URL="https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
          RUNTIME_SHA256="1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf"
          RUNTIME="${RUNNER_TEMP}/appimage-runtime-x86_64"
          curl -fsSL -o "$RUNTIME" "$RUNTIME_URL"
          echo "${RUNTIME_SHA256}  ${RUNTIME}" | sha256sum -c -

          node ../../.github/scripts/relink-appimage-fuse.mjs --runtime "$RUNTIME" --dir release

          # electron-builder published to a draft, so overwrite the AppImages and rewritten
          # manifests there and nobody ever sees the libfuse2 build.
          tag="v${VERSION}"
          shopt -s nullglob
          for f in release/*-linux-*.AppImage release/*-linux.yml; do
            echo "clobbering ${f} onto ${tag}"
            gh release upload "$tag" "$f" --clobber --repo "${OWNER}/${REPO}"
          done

      # The MSIX, built every release and attached to none of them. Built, because a target
      # nobody builds rots; not published, because an unsigned MSIX cannot be installed.
      - name: Package the MSIX
        if: runner.os == 'Windows' && matrix.variant == 'full'
        working-directory: packages/client
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
          # Same as the step above: empty until a certificate exists, and the hook says out
          # loud that the package it just made cannot be installed.
          GRYT_WIN_SIGN_TOOL: ${{ secrets.WINDOWS_SIGN_TOOL }}
          GRYT_WIN_SIGN_ARGS: ${{ secrets.WINDOWS_SIGN_ARGS }}
        run: |
          set -euo pipefail

          npx electron-builder \
            --win appx \
            --publish never \
            -c.extraMetadata.version="$VERSION"

          ls -la release/*.appx

      # Kept for a month rather than forever: long enough to pull one for a Store submission,
      # short enough that a quarter-gigabyte per release does not pile up.
      - name: Upload the MSIX
        if: runner.os == 'Windows' && matrix.variant == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ env.VERSION }}
          path: packages/client/release/*.appx
          retention-days: 30
          if-no-files-found: error

      # Push the MSIX to the Microsoft Store, which owns updates for its own build. Stable
      # only, dormant without AZURE_AD_*, and asynchronous: it does not gate publish-release.
      - name: Set up the Microsoft Store CLI
        if: runner.os == 'Windows' && matrix.variant == 'full' && env.CHANNEL == 'latest' && env.HAS_STORE_CREDS == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Submit the MSIX to the Microsoft Store
        if: runner.os == 'Windows' && matrix.variant == 'full' && env.CHANNEL == 'latest' && env.HAS_STORE_CREDS == 'true'
        continue-on-error: true
        working-directory: packages/client
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          # The 12-character Store ID from the listing URL,
          # apps.microsoft.com/detail/<id>.
          $productId = "9PKPT1C2M95Q"
          $appx = Get-ChildItem -Path "release" -Filter "*.appx" | Select-Object -First 1
          if (-not $appx) { throw "No .appx in release/ to submit." }
          Write-Host "Submitting $($appx.Name) to the Microsoft Store ($productId)"
          # sellerId is a placeholder on purpose: reconfigure refuses to run without one, but
          # the submission API is scoped by the app credentials rather than the seller.
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId 0 `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          # The argument is the project root, not the package: pointing it at
          # the .appx makes it look there for a project and find no publisher.
          msstore publish . --inputFile $appx.FullName -id $productId

      - name: Package macOS app
        if: runner.os == 'macOS'
        working-directory: packages/client
        shell: bash
        env:
          DEBUG: electron-builder,electron-osx-sign,electron-notarize
          # The keychain "Prepare macOS signing keychain" built, rather than CSC_LINK: with
          # that set, electron-builder unlocks with the wrong password and macOS 26.6 refuses.
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain-db
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" ]]; then
            echo "APPLE_API_KEY_P8_BASE64 is not set."
            exit 1
          fi

          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

          # The publish overrides matter even though this uploads separately: electron-builder
          # bakes them into app-update.yml, and without them macOS asked an empty repository.

          # `forceCodeSigning` is the other half of dropping CSC_LINK: without it a missing
          # identity only warns, and the build ships an app Gatekeeper refuses.
          npx electron-builder \
            --config electron-builder.config.cjs \
            --mac \
            --publish never \
            -c.mac.forceCodeSigning=true \
            -c.extraMetadata.version="$VERSION" \
            -c.publish.provider=github \
            -c.publish.owner="$OWNER" \
            -c.publish.repo="$REPO"

          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload macOS assets to GitHub Release
        if: runner.os == 'macOS'
        working-directory: packages/client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"

          shopt -s nullglob
          ASSETS=(
            release/*.dmg
            release/*.zip
            release/*.blockmap
            # A glob, because the channel file is named after the channel. Spelled out as a
            # literal it did not exist and the upload failed, which kept macOS slim off v1.9.15.
            release/*-mac.yml
          )
          shopt -u nullglob

          if [[ "${#ASSETS[@]}" -eq 0 ]]; then
            echo "No macOS assets found in packages/client/release/"
            ls -la release || true
            exit 1
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --repo "$OWNER/$REPO" --clobber

      # ── Each platform goes live on its own ──────────────────────────────
      #
      # The client already refuses a release it cannot install: it wants this platform's
      # channel file and the installer it names, so a part-published release is skipped.

      # `--draft=false` on a published release is a no-op, so six legs racing is fine. Each
      # checks the same two things rather than trusting the upload above.
      - name: Make this platform's build available
        working-directory: packages/client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"

          # electron-builder names the channel file after the channel, and slim publishes on
          # one of its own so the two variants do not overwrite each other.
          if [[ "$VARIANT" == "slim" ]]; then CHANNEL="slim"; else CHANNEL="latest"; fi

          case "$RUNNER_OS" in
            macOS)   YML="${CHANNEL}-mac.yml" ;;
            Windows) YML="${CHANNEL}.yml" ;;
            *)       YML="${CHANNEL}-linux.yml" ;;
          esac

          if [[ ! -f "release/$YML" ]]; then
            echo "::warning::This leg produced no $YML, so it has nothing to publish."
            exit 0
          fi

          # The installer the channel file points at: a release carrying one without the other
          # is one the updater breaks on. `|| true` on both, or a transient error fails the leg.
          INSTALLER="$(grep -m1 -E '^[[:space:]]*path:' "release/$YML" | sed -E 's/^[[:space:]]*path:[[:space:]]*//' | tr -d '\r' || true)"

          if [[ -z "$INSTALLER" ]]; then
            echo "::warning::No path: in $YML, so there is no way to check what it installs."
            exit 0
          fi

          ON_RELEASE="$(gh release view "$TAG" --repo "$OWNER/$REPO" --json assets --jq '.assets[] | select(.size > 0) | .name' || true)"

          for NEEDED in "$YML" "$INSTALLER"; do
            if ! printf '%s\n' "$ON_RELEASE" | grep -qxF "$NEEDED"; then
              echo "::warning::$NEEDED is not on $TAG yet, so this leg is leaving it alone."
              exit 0
            fi
          done

          gh release edit "$TAG" --repo "$OWNER/$REPO" --draft=false
          echo "$TAG is installable on $RUNNER_OS ($VARIANT)."

  # Runs after every matrix leg, once each has published the release itself. It owns the
  # whole-release work: checksums, the attestation, the notes appendix, and one Discord post.
  publish-release:
    name: Publish release
    needs: [prepare-release, build-electron]
    runs-on: ubuntu-latest

    env:
      OWNER: Gryt-chat
      REPO: gryt
      VERSION: ${{ needs.prepare-release.outputs.version }}
      CHANNEL: ${{ needs.prepare-release.outputs.channel }}

    steps:
      - name: Verify every platform uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"
          ASSETS="$(gh release view "$TAG" --repo "$OWNER/$REPO" --json assets --jq '.assets[].name')"

          echo "Assets on $TAG:"
          printf '%s\n' "$ASSETS" | sed 's/^/  /'

          # One installer per platform plus the three channel files. A client whose channel
          # file is missing gets a 404 and reports the release as broken.
          MISSING=0
          for PATTERN in \
            'win-x64\.exe$' \
            'linux-x86_64\.AppImage$' \
            'mac-arm64\.zip$' \
            '^latest\.yml$' \
            '^latest-linux\.yml$' \
            '^latest-mac\.yml$'
          do
            if ! printf '%s\n' "$ASSETS" | grep -qE "$PATTERN"; then
              echo "::error::No asset matching $PATTERN"
              MISSING=1
            fi
          done

          if [[ "$MISSING" -ne 0 ]]; then
            # No longer "leaving it as a draft": the legs that finished have published it, and
            # taking it back would pull an update out from under whoever has it.
            echo "::error::$TAG is missing assets. It stays published for the platforms that have them."
            exit 1
          fi

          echo "All expected assets present."

      # Something to check a download against, and something that is not just Sivert saying so
      # (GRYT-723). Here rather than per leg, so the sums cover the assets as they end up.
      - name: Download the assets and write SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"
          mkdir -p dist

          gh release download "$TAG" --repo "$OWNER/$REPO" --dir dist --clobber

          # Removed rather than skipped: a re-run would otherwise hash the previous run's sums
          # into the new file, and the line would be wrong the moment it is rewritten.
          rm -f dist/SHA256SUMS.txt

          cd dist
          # A glob rather than `ls`, so a filename with a space stays one argument. Globs come
          # out sorted, which keeps the file stable between runs.
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .

          echo "Sums:"
          sed 's/^/  /' SHA256SUMS.txt

      # An attestation is the part that is not a promise: a public append-only log run by
      # somebody who is not us, saying these bytes came out of this workflow at this commit.
      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          # Every installer, plus the sums file. Attesting the sums covers the blockmaps and
          # the three channel `.yml` files transitively, since they are listed in it.
          subject-path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Upload SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "v$VERSION" dist/SHA256SUMS.txt \
            --repo "$OWNER/$REPO" --clobber

      - name: Say how to check a download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"

          # Appended to whatever the notes already say rather than replacing them: they are
          # generated from the manifest earlier, and this runs after that.
          gh release view "$TAG" --repo "$OWNER/$REPO" --json body --jq .body > notes.md

          # `printf` rather than a heredoc: everything here is indented inside a YAML block
          # scalar, and a terminator has to start at column zero or the block runs to EOF.
          printf '%s\n' \
            "" \
            "---" \
            "" \
            "### Checking this download" \
            "" \
            "\`SHA256SUMS.txt\` on this release has a hash for every file here." \
            "" \
            '```' \
            "sha256sum --check --ignore-missing SHA256SUMS.txt" \
            '```' \
            "" \
            "Every artifact is attested too, so you can check it came out of this" \
            "repository rather than only that it matches a hash we published" \
            "ourselves." \
            "" \
            '```' \
            "gh attestation verify <file> --repo $OWNER/$REPO" \
            '```' \
            "" \
            "So is the web client image, which is what you get if you host Gryt" \
            "yourself rather than installing the app:" \
            "" \
            '```' \
            "gh attestation verify oci://$DOCKER_IMAGE:$VERSION --repo $OWNER/$REPO" \
            '```' \
            >> notes.md

          gh release edit "$TAG" --repo "$OWNER/$REPO" --notes-file notes.md

      # A backstop now rather than the moment of release: every leg publishes once its own
      # assets are up. It stays for the leg that uploads and then cannot reach the API.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release edit "v$VERSION" --repo "$OWNER/$REPO" --draft=false
          echo "v$VERSION is published."

      # Every publisher listens for `release: published`, which does not fire for a release
      # created with GITHUB_TOKEN. `workflow_dispatch` is exempt, so dispatching them works.

      # All four, because this carried only the snap and v1.10.1 left three unrun. Dispatched
      # rather than made jobs here, or they would hold the shared concurrency group.

      # Stable only, since publish-snap.yml treats any dispatch as deliberate and skips its
      # own check. `continue-on-error`, because the Store is not part of availability.
      - name: Start the store publishers
        if: needs.prepare-release.outputs.channel == 'latest'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # One at a time, and a failure to dispatch one must not stop the rest.
          for WF in \
            publish-snap.yml \
            publish-aur.yml \
            publish-homebrew.yml \
            publish-winget.yml
          do
            if gh workflow run "$WF" \
              --repo "$OWNER/$REPO" \
              --ref main \
              -f tag="v$VERSION"
            then
              echo "Dispatched $WF for v$VERSION."
            else
              echo "::warning::Could not dispatch $WF for v$VERSION."
            fi
          done

      # Moved here from the Linux build leg. Announcing from there fired while macOS was
      # still signing, so #releases advertised a build Mac users could not install.
      - name: Notify Discord
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL secret not set, skipping"
            exit 0
          fi

          TAG="v$VERSION"
          RELEASE_URL="https://github.com/${OWNER}/${REPO}/releases/tag/${TAG}"

          if [[ "$CHANNEL" == "beta" ]]; then
            TITLE="BETA Client release"
            COLOR=16750848
            DESCRIPTION="New desktop build is available for testing."
          else
            TITLE="STABLE Client release"
            COLOR=5763719
            DESCRIPTION="New desktop build is available."
          fi

          PAYLOAD="$(jq -n \
            --arg title "$TITLE" \
            --arg url "$RELEASE_URL" \
            --arg desc "$DESCRIPTION" \
            --arg version "$VERSION" \
            --arg release "Open release" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: $color,
                fields: [
                  { name: "Version", value: $version, inline: true },
                  { name: "Release", value: ("[" + $release + "](" + $url + ")"), inline: true }
                ],
                footer: { text: "Gryt Client" },
                timestamp: (now | todate)
              }]
            }'
          )"

          curl -sfS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"

  # Take back what a failed release left lying around: a run that dies after "Prepare release"
  # has already pushed the tag and created the draft (GRYT-466).

  # Draft only, and that is the whole safety argument: a draft has been seen by nobody. The
  # release.json and package.json bumps survive, which is what a re-dispatch wants to find.
  cleanup-failed-release:
    name: Clean up a failed release
    needs: [prepare-release, build-electron, publish-release]

    # Not `failure()`: publish-release may be skipped rather than failed when a build dies,
    # so the condition is written out. It runs when the version is known.
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      (needs.build-electron.result != 'success' ||
      needs.publish-release.result != 'success')

    runs-on: ubuntu-latest

    env:
      OWNER: Gryt-chat
      REPO: gryt
      VERSION: ${{ needs.prepare-release.outputs.version }}

    steps:
      - name: Delete the tag and release, if it never left draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"

          IS_DRAFT="$(
            gh release view "$TAG" --repo "$OWNER/$REPO" --json isDraft --jq .isDraft 2>/dev/null || true
          )"

          if [[ "$IS_DRAFT" == "false" ]]; then
            echo "$TAG is published. Leaving it, and its tag, alone."
            exit 0
          fi

          if [[ "$IS_DRAFT" == "true" ]]; then
            # --cleanup-tag takes the git tag with it, which is the half that
            # blocks a re-dispatch at the same version.
            echo "Deleting the draft release $TAG and its tag."
            gh release delete "$TAG" --repo "$OWNER/$REPO" --yes --cleanup-tag
            exit 0
          fi

          # No release at all. The run died between pushing the tag and creating
          # the release, so the tag is the only thing out there.
          if git ls-remote --exit-code --tags \
              "https://github.com/$OWNER/$REPO.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "No release for $TAG, deleting the stranded tag."
            gh api -X DELETE "repos/$OWNER/$REPO/git/refs/tags/$TAG"
          else
            echo "Nothing to clean up for $TAG."
          fi

      - name: Say what to do next
        shell: bash
        run: |
          set -euo pipefail

          echo "::notice::v$VERSION has been cleared. Fix the failure and"
          echo "::notice::dispatch again with bump=none to reuse the number."
